<style>

.chip.mxc{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:.92rem;padding:.25rem .65rem;line-height:1.6}
.chip.mxc .ig{font-size:1.15em}
.chip.mxc .fr{font-size:.78em}
.guide{margin:.4rem 0 0;padding-left:1.25rem;display:grid;gap:.6rem;font-size:.84rem;line-height:1.45}
.guide li::marker{color:var(--muted);font-weight:700}
.guide li .chip{margin-top:.3rem;font-weight:500;font-family:"Source Serif 4",Georgia,serif}
.guide li.on{color:var(--ink)}
.guide li.on::marker{color:var(--accent)}
.guide li.on>div>.linkbtn::after{content:" ●";color:var(--accent);font-size:.7em;vertical-align:.15em}
.ov{max-width:calc(100% - 70px);flex-direction:column;align-items:flex-start;gap:.15rem;font-size:1.05rem;line-height:1.7}
.ov .fr{font-size:.8em}
.ov>span:first-child{overflow-x:auto;max-width:100%;white-space:nowrap}
#modeSeg button{font-family:"Source Serif 4",Georgia,serif;font-size:.95rem;font-style:italic}
.top .seg{flex-wrap:nowrap;flex:none}
.prop .v .fr{font-size:.8em}

#pIn{width:100%;min-height:9.5rem;resize:vertical;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.86rem;line-height:1.5;border:1px solid var(--line);border-left:3px solid var(--s-line);border-radius:8px;background:var(--bg);color:var(--ink);padding:.5rem .6rem;margin-top:.2rem}
.prob{font-family:"Source Serif 4",Georgia,serif;font-size:1rem;line-height:1.75;margin-top:.55rem;overflow-x:auto}
.sys{display:inline-grid;vertical-align:middle;grid-template-columns:auto auto auto;column-gap:.45em;align-items:baseline;border-left:2px solid var(--muted);padding-left:.55em;margin:.15rem 0;font-family:"Source Serif 4",Georgia,serif}
.sys>span:nth-child(3n+1){text-align:right}.sys .no{color:var(--muted);font-size:.8em;margin-left:.6em}
.prob .obj{display:block}
.prob .sg{display:block;color:var(--muted);font-size:.92em}
.tw{overflow-x:auto;margin:.45rem 0 .6rem}
table.tab{border-collapse:collapse;font-family:"Source Serif 4",Georgia,serif;font-size:.88rem;min-width:100%}
table.tab th,table.tab td{padding:.18rem .42rem;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.tab th{font-weight:600;color:var(--muted);font-size:.8rem}
table.tab td.bs{color:var(--muted);font-style:italic;text-align:left}
table.tab tr.zr td{border-top:2px solid var(--muted);border-bottom:none}
table.tab td.b,table.tab th.b{border-left:2px solid var(--muted)}
table.tab td.pc{background:color-mix(in srgb,var(--accent) 10%,transparent)}
table.tab td.piv{outline:2px solid var(--s-opt);outline-offset:-2px;font-weight:700;background:color-mix(in srgb,var(--s-opt) 15%,transparent)}
table.tab .fr{font-size:.8em}
.stp{margin:.4rem 0 0;padding-left:1.4rem;font-family:"Source Serif 4",Georgia,serif;font-size:.93rem;line-height:1.65;list-style:none;counter-reset:st}
.stp>li{position:relative;margin:.4rem 0;counter-increment:st}
.stp>li::before{content:counter(st) '.';position:absolute;left:-1.35rem;color:var(--muted);font-family:Manrope,system-ui,sans-serif;font-size:.8rem;font-weight:700;top:.12rem}
.stp .sub{display:block;margin:.2rem 0 .1rem .4rem;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.vt{border-collapse:collapse;font-family:"Source Serif 4",Georgia,serif;font-size:.9rem;margin:.3rem 0}
.vt td,.vt th{padding:.12rem .6rem;border-bottom:1px solid var(--line);text-align:left}
.vt tr.best td{color:var(--s-opt);font-weight:700}
.rep{border-collapse:collapse;width:100%;font-size:.82rem;margin:.35rem 0 .7rem}
.rep th{color:var(--muted);font-weight:700;text-align:right;padding:.2rem .35rem;border-bottom:1px solid var(--line);font-size:.74rem}
.rep th:first-child,.rep td:first-child{text-align:left}
.rep td{padding:.22rem .35rem;border-bottom:1px solid var(--line);text-align:right;font-family:"Source Serif 4",Georgia,serif;font-size:.92rem}
.mxs{font-family:"Source Serif 4",Georgia,serif}
.h4{font-size:.78rem;font-weight:800;color:var(--muted);margin:.8rem 0 .2rem;letter-spacing:.01em}
.steplog{margin:.5rem 0 .2rem;font-family:"Source Serif 4",Georgia,serif;font-size:.92rem;line-height:1.55}
.cs{font-family:"Source Serif 4",Georgia,serif;line-height:1.8;font-size:.95rem}
#modeSeg button.dis{opacity:.42;cursor:not-allowed}
#pre .pg{margin:.55rem 0 .3rem}#pre .pg:first-child{margin-top:.15rem}

<script>
(()=>{
'use strict';
/* ---------- точные дроби ---------- */
function toFrac(v,maxD=1000,tol=1e-10){if(!isFinite(v))return null;if(Number.isInteger(v))return[v,1];
  const s=v<0?-1:1;v=Math.abs(v);let h0=0,h1=1,k0=1,k1=0,x=v;
  for(let i=0;i<40;i++){const a=Math.floor(x),h2=a*h1+h0,k2=a*k1+k0;if(k2>maxD)break;h0=h1;h1=h2;k0=k1;k1=k2;
    if(Math.abs(v-h1/k1)<=tol*Math.max(1,v))return[s*h1,k1];const fr=x-a;if(fr<1e-15)break;x=1/fr}
  return null}
const gcdI=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
class Q{constructor(n,d=1){if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||Math.abs(n)>1e14||Math.abs(d)>1e14){const v=n/d,f=toFrac(v,1e6,1e-13)||[Math.round(v*1e6),1e6];n=f[0];d=f[1]}
    if(d<0){n=-n;d=-d}const g=gcdI(n,d)||1;this.n=n/g;this.d=d/g}
  static of(x){if(x instanceof Q)return x;if(Number.isInteger(x))return new Q(x,1);const f=toFrac(x,1e6,1e-12);return f?new Q(f[0],f[1]):new Q(Math.round(x*1e6),1e6)}
  add(o){o=Q.of(o);return new Q(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=Q.of(o);return new Q(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=Q.of(o);const g1=gcdI(this.n,o.d)||1,g2=gcdI(o.n,this.d)||1;return new Q((this.n/g1)*(o.n/g2),(this.d/g2)*(o.d/g1))}
  div(o){o=Q.of(o);return this.mul(new Q(o.d,o.n))}
  neg(){return new Q(-this.n,this.d)}
  get z(){return this.n===0}
  get s(){return Math.sign(this.n)}
  get v(){return this.n/this.d}
  cmp(o){return this.sub(o).s}
  eq(o){return this.cmp(o)===0}
  abs(){return this.n<0?this.neg():this}
}
const Z0=new Q(0),Q1=new Q(1);
function parseNum(s){s=s.replace(',','.');if(s.includes('/')){const[a,b]=s.split('/');return parseNum(a).div(parseNum(b))}
  if(s.includes('.')){const[i,f]=s.split('.');const d=Math.pow(10,f.length);return new Q(parseInt((i||'0')+f,10)*(s.trim().startsWith('-')?1:1),d)}
  return new Q(parseInt(s,10),1)}
/* ---------- разбор задачи ---------- */
function normLine(l){return l.replace(/[−–—]/g,'-').replace(/[⩽≤]/g,'<=').replace(/[⩾≥]/g,'>=').replace(/=</g,'<=').replace(/=>/g,'>=').replace(/→/g,'->').replace(/·|×|\*/g,'*').replace(/(\d),(\d)/g,'$1.$2').trim()}
function natCmp(a,b){const ma=/^([a-zA-Zа-яА-Я_']*)(\d*)(.*)$/.exec(a),mb=/^([a-zA-Zа-яА-Я_']*)(\d*)(.*)$/.exec(b);if(ma[1]!==mb[1])return ma[1]<mb[1]?-1:1;const na=+ma[2]||0,nb=+mb[2]||0;if(na!==nb)return na-nb;return a<b?-1:a>b?1:0}
function parseLin(s){// -> {coef:{name:Q}, c:Q}
  s=s.replace(/\s+/g,'');if(!s)throw{msg:'empty'};const out={coef:{},c:Z0};let i=0;
  if(s[0]!=='+'&&s[0]!=='-')s='+'+s;
  while(i<s.length){const sg=s[i]==='-'?-1:1;if(s[i]!=='+'&&s[i]!=='-')throw{msg:'tok',at:s.slice(i)};i++;
    let num=null,m=/^(\d+(\.\d+)?|\.\d+)(\/(\d+(\.\d+)?))?/.exec(s.slice(i));if(m){num=parseNum(m[0]);i+=m[0].length;if(s[i]==='*')i++}
    let v=null;m=/^([a-zA-Z][a-zA-Z_]*\d*'*|[a-zA-Z]_?\d+)/.exec(s.slice(i));if(m){v=m[0].replace('_','');i+=m[0].length}
    if(num===null&&v===null)throw{msg:'tok',at:s.slice(i)};
    let q=num||Q1;
    while(s[i]==='/'){m=/^\/(\d+(\.\d+)?)/.exec(s.slice(i));if(!m)throw{msg:'tok'};q=q.div(parseNum(m[1]));i+=m[0].length}
    if(sg<0)q=q.neg();
    if(v){out.coef[v]=(out.coef[v]||Z0).add(q)}else out.c=out.c.add(q)}
  return out}
function parseProblem(text){const lines=[];for(const l0 of text.split(/\n|;/).map(normLine).filter(l=>l&&!/^\/\//.test(l))){const ops=[...l0.matchAll(/<=|>=/g)];
    if(ops.length===2){const a=ops[0],b=ops[1],L=l0.slice(0,a.index),M=l0.slice(a.index+2,b.index),Rr=l0.slice(b.index+2);lines.push(L+a[0]+M,M+b[0]+Rr)}else lines.push(l0)}
  let obj=null;const cons=[],sign={},ints=new Set(),bins=new Set();let allInt=false,allBin=false,anySign=false;
  const varsIn=s=>(s.match(/[a-zA-Z][a-zA-Z_]*\d*'*/g)||[]).filter(w=>!/^(max|min|int|Z|N|z|bin)$/.test(w));
  for(const l0 of lines){let l=l0;
    if(/->|\b(max|min)\b/i.test(l)&&!/<=|>=/.test(l)){const sense=/max/i.test(l)?'max':'min';l=l.replace(/->/,' ').replace(/\b(max|min)\b/ig,' ').replace(/^\s*[a-zA-Z]\w*\s*\(?[^=()]*\)?\s*=/,' ').replace(/[:]/g,' ');
      obj={sense,...parseLin(l)};continue}
    if(/∈|\bint\b|целы|бинар|\bbin\b|\{0 ?[.,;] ?1\}/i.test(l)){const isB=/бинар|\bbin\b|\{0 ?[.,;] ?1\}/i.test(l);const vs=varsIn(l.replace(/\{[^}]*\}/,'').replace(/∈.*$/,''));
      if(!vs.length){if(isB)allBin=true;else allInt=true}else vs.forEach(v=>{(isB?bins:ints).add(v)});
      if(/>=\s*0|Z_?\+|Z>=0|⩾0/.test(l)||isB){vs.forEach(v=>{sign[v]='ge';anySign=true})}continue}
    if(/люб|free|произв|\bR\b|∈ ?R/i.test(l)&&!/<=|>=/.test(l)){varsIn(l).forEach(v=>{sign[v]='free'});continue}
    const m=/(<=|>=|=)/.exec(l);if(!m)throw{msg:'line',line:l0};const op=m[1],L=l.slice(0,m.index),R=l.slice(m.index+op.length);
    if(/,/.test(L)&&/^\s*0\s*$/.test(R)&&op!=='='){const vs=L.split(',').map(x=>x.trim().replace('_',''));if(vs.every(v=>/^[a-zA-Z][a-zA-Z_]*\d*'*$/.test(v))){vs.forEach(v=>{sign[v]=op==='>='?'ge':'le';anySign=true});continue}}
    const lp=parseLin(L),rp=parseLin(R);const coef={...lp.coef};for(const k in rp.coef)coef[k]=(coef[k]||Z0).sub(rp.coef[k]);const b=rp.c.sub(lp.c);
    const ks=Object.keys(coef).filter(k=>!coef[k].z);
    if(ks.length===1&&b.z&&op!=='='){const k=ks[0],pos=coef[k].s>0;sign[k]=(op==='>=')===pos?'ge':'le';anySign=true;continue}
    if(!ks.length)throw{msg:'nox',line:l0};
    cons.push({coef,op,b,src:l0})}
  if(!obj)throw{msg:'noobj'};if(!cons.length&&!Object.keys(obj.coef).length)throw{msg:'nocons'};
  const names=new Set(Object.keys(obj.coef));cons.forEach(c=>Object.keys(c.coef).forEach(k=>names.add(k)));
  const expand=k=>{if(names.has(k))return[k];const ex=[...names].filter(n=>new RegExp('^'+k+'_?\\d').test(n));return ex.length?ex:[k]};
  for(const k of Object.keys(sign)){const e=expand(k);if(e.length>1||e[0]!==k){e.forEach(n=>{sign[n]=sign[k]});delete sign[k]}}
  for(const S of[ints,bins])for(const k of[...S]){const e=expand(k);if(e.length>1||e[0]!==k){S.delete(k);e.forEach(n=>S.add(n))}}
  Object.keys(sign).forEach(k=>names.add(k));
  const vars=[...names].sort(natCmp);if(!vars.length)throw{msg:'novars'};if(vars.length>14)throw{msg:'many'};if(cons.length>20)throw{msg:'manyc'};
  const P={vars,sense:obj.sense,c:vars.map(v=>obj.coef[v]||Z0),c0:obj.c,cons:cons.map(c=>({a:vars.map(v=>c.coef[v]||Z0),op:c.op,b:c.b})),
    sign:vars.map(v=>sign[v]||'free'),int:vars.map(v=>allInt||allBin||ints.has(v)||bins.has(v)),bin:vars.map(v=>allBin||bins.has(v)),anySign};
  P.cons=P.cons.filter(c=>!(c.a.every(x=>x.z)));
  P.bin.forEach((b,j)=>{if(b){P.sign[j]='ge';const implied=P.cons.some(c=>(c.op==='<='||c.op==='=')&&c.a[j].s>0&&c.a.every((q,k)=>q.s>=0||!P.bin[k])&&c.a.every(q=>q.s>=0)&&c.b.div(c.a[j]).cmp(Q1)<=0);if(!implied)P.cons.push({a:vars.map((_,k)=>k===j?Q1:Z0),op:'<=',b:Q1,auto:true})}});
  return P}
/* ---------- двойственная задача (правила из § 4.1) ---------- */

const TERMS=[
 {id:'lp',ru:['Задача линейной оптимизации','ЛП, linear programming','<p>Нужно найти максимум или минимум <b>целевой функции</b> <span class="m">z = c₁x₁ + … + cₙxₙ</span> при <b>ограничениях</b> — линейных неравенствах и равенствах. Точки, удовлетворяющие всем ограничениям, называются <b>допустимыми</b>, а их совокупность — допустимым множеством.</p><p>Решение — допустимая точка, в которой целевая функция принимает наилучшее значение. Его может не быть (множество пусто или функция неограниченна), а может быть бесконечно много.</p>'],
  en:['Linear optimization problem','linear programming, LP','<p>Find the maximum or minimum of the <b>objective</b> <span class="m">z = c₁x₁ + … + cₙxₙ</span> subject to <b>constraints</b>, linear inequalities and equalities. Points satisfying all constraints are <b>feasible</b>; together they form the feasible set.</p><p>A solution is a feasible point with the best objective value. There may be none (the set is empty or the objective is unbounded), or infinitely many.</p>']},
 {id:'production',ru:['Производственная задача','§ 2.1, § 3.1','<p>Фирма выпускает n товаров из m видов сырья. <span class="m">aᵢⱼ</span> — расход сырья i на единицу товара j, <span class="m">bᵢ</span> — запас сырья, <span class="m">cⱼ</span> — цена товара. Максимизируем выручку: <span class="m">(c, x) → max</span>, <span class="m">Ax ⩽ b</span>, <span class="m">x ⩾ 0</span>.</p><p>Это «эталонная» форма: к ней сводится любая задача линейной оптимизации (теорема 3), для неё проще всего выписать двойственную и исследовать устойчивость.</p>'],
  en:['Production problem','§ 2.1, § 3.1','<p>A firm makes n goods from m raw materials. <span class="m">aᵢⱼ</span> is the use of material i per unit of good j, <span class="m">bᵢ</span> the stock of material, <span class="m">cⱼ</span> the price of the good. Maximize revenue: <span class="m">(c, x) → max</span>, <span class="m">Ax ⩽ b</span>, <span class="m">x ⩾ 0</span>.</p><p>This is the reference form: every linear optimization problem reduces to it (Theorem 3), and for it the dual and the stability analysis are easiest.</p>']},
 {id:'transport',ru:['Транспортная задача','§ 2.2','<p>Груз везут с m складов на n заводов. <span class="m">xᵢⱼ</span> — сколько везём со склада i на завод j, <span class="m">cᵢⱼ</span> — тариф. Минимизируем <span class="m">Σ cᵢⱼxᵢⱼ</span> при условиях: со склада вывозим не больше запаса, на завод привозим не меньше спроса, <span class="m">xᵢⱼ ⩾ 0</span>.</p><p>Если суммарный спрос равен предложению, все неравенства становятся равенствами. Одно из них при этом лишнее: в симплекс-методе такая строка обнуляется и вычёркивается.</p>'],
  en:['Transportation problem','§ 2.2','<p>Goods are shipped from m depots to n plants. <span class="m">xᵢⱼ</span> is the amount from depot i to plant j, <span class="m">cᵢⱼ</span> the rate. Minimize <span class="m">Σ cᵢⱼxᵢⱼ</span> subject to: ship no more than each depot’s stock, deliver at least each plant’s demand, <span class="m">xᵢⱼ ⩾ 0</span>.</p><p>If total demand equals total supply, all inequalities become equalities. One of them is then redundant: in the simplex method that row turns to zeros and is dropped.</p>']},
 {id:'cutting',ru:['Задача о раскрое','§ 2.3, целочисленность','<p>Прутья режут разными способами на заготовки, из заготовок собирают комплекты. Переменные — сколько прутьев режем каждым способом, цель — максимум комплектов.</p><p>Важная особенность: переменные обязаны быть целыми. Оптимум без этого требования может оказаться дробным, и тогда задача становится заметно труднее.</p>'],
  en:['Cutting stock problem','§ 2.3, integrality','<p>Rods are cut in different ways into pieces, and pieces are assembled into sets. Variables say how many rods are cut each way; the goal is the maximum number of sets.</p><p>The key feature: variables must be integers. Without that requirement the optimum may be fractional, and the problem then becomes much harder.</p>']},
 {id:'binary',ru:['Бинарные переменные','задача о рюкзаке, § 2.4','<p>Переменная <span class="m">xᵢ ∈ {0, 1}</span> отвечает на вопрос «да или нет»: брать предмет или нет. Пример — задача о рюкзаке: унести предметы наибольшей ценности при ограничении на вес.</p><p>Быстрого алгоритма для таких задач не известно. Здесь для небольшого числа переменных перебираются все <span class="m">2ⁿ</span> вариантов, поэтому находятся все оптимальные наборы.</p>'],
  en:['Binary variables','knapsack problem, § 2.4','<p>A variable <span class="m">xᵢ ∈ {0, 1}</span> answers yes or no: take the item or not. Example: the knapsack problem, carry the most valuable items under a weight limit.</p><p>No fast algorithm is known for such problems. Here, for a small number of variables, all <span class="m">2ⁿ</span> options are tried, so all optimal sets are found.</p>']},
 {id:'feasible',ru:['Допустимое множество','многоугольник','<p>Каждое неравенство <span class="m">a₁x₁ + a₂x₂ ⩽ b</span> задаёт полуплоскость: прямую <span class="m">a₁x₁ + a₂x₂ = b</span> и всё по одну сторону от неё. Сторону находят пробной точкой, обычно (0; 0): если неравенство в ней верно, берём сторону с ней.</p><p>Допустимое множество — пересечение всех полуплоскостей. Оно выпуклое: это многоугольник, неограниченная область, отрезок, точка или пустое множество. Равенство оставляет только саму прямую.</p>'],
  en:['Feasible set','polygon','<p>Each inequality <span class="m">a₁x₁ + a₂x₂ ⩽ b</span> defines a half-plane: the line <span class="m">a₁x₁ + a₂x₂ = b</span> and everything on one side. Find the side with a test point, usually (0; 0): if the inequality holds there, take that side.</p><p>The feasible set is the intersection of all half-planes. It is convex: a polygon, an unbounded region, a segment, a point or empty. An equality leaves only the line itself.</p>']},
 {id:'gradient',ru:['Градиент','∇z','<p>Градиент функции <span class="m">z(x₁, …, xₙ)</span> — вектор частных производных <span class="m">∇z = (z′ₓ₁, …, z′ₓₙ)</span>. Он показывает направление наискорейшего роста функции, а противоположное направление — наискорейшего убывания.</p><p>У линейной функции <span class="m">z = c₁x₁ + c₂x₂</span> градиент один и тот же во всех точках: <span class="m">∇z = (c₁; c₂)</span>. Его рисуют стрелкой из начала координат. На сцене кончик стрелки можно тянуть — так меняется целевая функция.</p>'],
  en:['Gradient','∇z','<p>The gradient of <span class="m">z(x₁, …, xₙ)</span> is the vector of partial derivatives <span class="m">∇z = (z′ₓ₁, …, z′ₓₙ)</span>. It points in the direction of fastest growth; the opposite direction is fastest decrease.</p><p>For a linear function <span class="m">z = c₁x₁ + c₂x₂</span> the gradient is the same everywhere: <span class="m">∇z = (c₁; c₂)</span>. It is drawn as an arrow from the origin. On the scene you can drag its tip to change the objective.</p>']},
 {id:'level',ru:['Линия уровня','z = const','<p>Линия уровня — множество точек, где целевая функция принимает одно и то же значение: <span class="m">c₁x₁ + c₂x₂ = C</span>. Это прямая, перпендикулярная градиенту.</p><p>При увеличении C линия сдвигается параллельно самой себе по направлению градиента. Пока она пересекает допустимое множество, значение C достижимо.</p>'],
  en:['Level line','z = const','<p>A level line is the set of points where the objective takes one value: <span class="m">c₁x₁ + c₂x₂ = C</span>. It is a line perpendicular to the gradient.</p><p>As C increases, the line shifts parallel to itself in the direction of the gradient. While it meets the feasible set, the value C is attainable.</p>']},
 {id:'graphical',ru:['Графический метод','две переменные','<p>Алгоритм для задачи с двумя переменными:</p><p>1. Строим прямые ограничений и выбираем полуплоскости — получаем допустимое множество.<br>2. Рисуем градиент <span class="m">∇z = (c₁; c₂)</span> и перпендикулярную ему линию уровня.<br>3. Для <b>максимума</b> двигаем линию уровня по направлению градиента до <b>последней</b> точки множества, для <b>минимума</b> — до <b>первой</b> (так в учебнике).<br>4. Находим координаты этой вершины, решая систему из уравнений двух прямых, и считаем z.</p><p>Если переменных больше двух, но ограничений два, графически решают двойственную задачу.</p>'],
  en:['Graphical method','two variables','<p>The algorithm for a problem with two variables:</p><p>1. Draw the constraint lines and choose the half-planes to get the feasible set.<br>2. Draw the gradient <span class="m">∇z = (c₁; c₂)</span> and a level line perpendicular to it.<br>3. For a <b>maximum</b> move the level line along the gradient up to the <b>last</b> point of the set; for a <b>minimum</b>, up to the <b>first</b> (as in the textbook).<br>4. Find the vertex coordinates by solving the system of the two lines, and compute z.</p><p>With more than two variables but two constraints, solve the dual graphically.</p>']},
 {id:'vertex',ru:['Почему оптимум в вершине','перебор вершин','<p>Линейная функция на многоугольнике достигает максимума и минимума в вершинах: двигая линию уровня, мы покидаем множество именно через вершину (или через целую сторону, если она параллельна линии уровня).</p><p>Поэтому ограниченную задачу можно проверить перебором: посчитать z во всех вершинах и выбрать лучшее. В блоке «Как решить» такая таблица приводится для проверки.</p>'],
  en:['Why the optimum is at a vertex','trying all vertices','<p>A linear function on a polygon attains its maximum and minimum at vertices: moving the level line, we leave the set through a vertex (or a whole side, if it is parallel to the level line).</p><p>So a bounded problem can be checked by brute force: compute z at every vertex and pick the best. The How to solve block gives such a table as a check.</p>']},
 {id:'special',ru:['Особые случаи','нет решений, ∞, много решений','<p><b>Нет допустимых точек:</b> полуплоскости не пересекаются, ограничения противоречат друг другу.</p><p><b>Целевая функция неограниченна:</b> множество не ограничено в сторону градиента (для max), линия уровня уходит в бесконечность. Решения нет.</p><p><b>Бесконечно много решений:</b> линия уровня параллельна стороне множества и в последний момент ложится на всю сторону — оптимален весь отрезок или луч.</p>'],
  en:['Special cases','no solution, ∞, many solutions','<p><b>No feasible points:</b> the half-planes don’t intersect; the constraints contradict each other.</p><p><b>Unbounded objective:</b> the set is unbounded in the gradient direction (for max), the level line escapes to infinity. No solution.</p><p><b>Infinitely many solutions:</b> the level line is parallel to a side and at the last moment lies along it, so the whole segment or ray is optimal.</p>']},
 {id:'dual',ru:['Двойственная задача','§ 3.1, теневые цены','<p>К производственной задаче <span class="m">(c, x) → max</span>, <span class="m">Ax ⩽ b</span>, <span class="m">x ⩾ 0</span> двойственная: <span class="m">(b, y) → min</span>, <span class="m">Aᵀy ⩾ c</span>, <span class="m">y ⩾ 0</span>.</p><p>Экономический смысл: фирма может не производить товары, а продать сырьё по ценам <span class="m">y</span>. Покупатель хочет заплатить как можно меньше, но так, чтобы сырьё на единицу каждого товара стоило не меньше цены товара. Числа <span class="m">yᵢ</span> называются <b>теневыми ценами</b> ресурсов.</p>'],
  en:['Dual problem','§ 3.1, shadow prices','<p>For the production problem <span class="m">(c, x) → max</span>, <span class="m">Ax ⩽ b</span>, <span class="m">x ⩾ 0</span> the dual is <span class="m">(b, y) → min</span>, <span class="m">Aᵀy ⩾ c</span>, <span class="m">y ⩾ 0</span>.</p><p>Economic meaning: instead of producing, the firm could sell its materials at prices <span class="m">y</span>. The buyer wants to pay as little as possible, but the materials for one unit of each good must cost at least the good’s price. The numbers <span class="m">yᵢ</span> are the <b>shadow prices</b> of resources.</p>']},
 {id:'dualrule',ru:['Правило выписывания двойственной','общий вид, § 4.1','<p>max меняется на min и наоборот; матрица ограничений транспонируется; коэффициенты целевой функции и правые части меняются местами.</p><p><b>Знаки двойственных переменных.</b> Для исходной задачи на max: ограничение ⩽ → <span class="m">y ⩾ 0</span>, ⩾ → <span class="m">y ⩽ 0</span>, = → y любого знака. На min — наоборот: ⩽ → <span class="m">y ⩽ 0</span>, ⩾ → <span class="m">y ⩾ 0</span>.</p><p><b>Знаки двойственных ограничений.</b> Если двойственная на min: <span class="m">x ⩾ 0</span> → ⩾, <span class="m">x ⩽ 0</span> → ⩽; на max: <span class="m">x ⩾ 0</span> → ⩽, <span class="m">x ⩽ 0</span> → ⩾. Переменная любого знака даёт равенство. Блок «Двойственная задача» показывает, какое правило сработало для каждой строки.</p>'],
  en:['Writing the dual','general form, § 4.1','<p>max becomes min and vice versa; the constraint matrix is transposed; objective coefficients and right-hand sides swap.</p><p><b>Signs of dual variables.</b> If the original is a max problem: ⩽ → <span class="m">y ⩾ 0</span>, ⩾ → <span class="m">y ⩽ 0</span>, = → y free. For min it is reversed: ⩽ → <span class="m">y ⩽ 0</span>, ⩾ → <span class="m">y ⩾ 0</span>.</p><p><b>Signs of dual constraints.</b> If the dual is a min problem: <span class="m">x ⩾ 0</span> → ⩾, <span class="m">x ⩽ 0</span> → ⩽; if max: <span class="m">x ⩾ 0</span> → ⩽, <span class="m">x ⩽ 0</span> → ⩾. A free variable gives an equality. The Dual block shows which rule fired for each line.</p>']},
 {id:'kant1',ru:['Первая теорема Канторовича','теорема 1','<p>Прямая задача имеет решение тогда и только тогда, когда допустимые множества прямой и двойственной задач непусты. Если допустимые x и y дают одинаковые значения <span class="m">(c, x) = (b, y)</span>, то обе точки оптимальны.</p><p>Если решение есть, то оптимальные значения прямой и двойственной задач совпадают. Это удобная проверка ответа: max прямой = min двойственной.</p>'],
  en:['Kantorovich’s first theorem','Theorem 1','<p>The primal has a solution if and only if the feasible sets of both the primal and the dual are non-empty. If feasible x and y give equal values <span class="m">(c, x) = (b, y)</span>, both are optimal.</p><p>If a solution exists, the optimal values of the primal and dual coincide. That is a handy check: primal max = dual min.</p>']},
 {id:'kant2',ru:['Дополняющая нежёсткость','вторая теорема Канторовича','<p>Допустимые x и y оптимальны тогда и только тогда, когда для каждой пары «переменная — ограничение» произведение равно нулю:</p><p><span class="m">xⱼ · (a₁ⱼy₁ + … + aₘⱼyₘ − cⱼ) = 0</span>, <span class="m">yᵢ · (aᵢ₁x₁ + … + aᵢₙxₙ − bᵢ) = 0</span>.</p><p>Смысл: если ограничение выполняется не впритык (есть запас), соответствующая переменная другой задачи равна нулю. И наоборот: если <span class="m">yᵢ ≠ 0</span>, ограничение i выполняется как равенство. Условия выписываются только для ограничений-неравенств.</p>'],
  en:['Complementary slackness','Kantorovich’s second theorem','<p>Feasible x and y are optimal if and only if for each pair “variable — constraint” the product is zero:</p><p><span class="m">xⱼ · (a₁ⱼy₁ + … + aₘⱼyₘ − cⱼ) = 0</span>, <span class="m">yᵢ · (aᵢ₁x₁ + … + aᵢₙxₙ − bᵢ) = 0</span>.</p><p>Meaning: if a constraint is not tight (there is slack), the matching variable of the other problem is zero. Conversely, if <span class="m">yᵢ ≠ 0</span>, constraint i holds as an equality. The conditions are written only for inequality constraints.</p>']},
 {id:'csmethod',ru:['Решение через двойственную','как в § 3.2','<p>Если в прямой задаче много переменных, но всего два ограничения, у двойственной две переменные. Тогда:</p><p>1. Выписываем двойственную и решаем её графически, находим точку M.<br>2. Смотрим, на каких прямых лежит M. Если M не лежит на прямой (j), то <span class="m">xⱼ = 0</span>.<br>3. Если <span class="m">yᵢ ≠ 0</span>, то ограничение i прямой задачи — равенство.<br>4. Решаем получившуюся систему и находим x. Проверяем: значения прямой и двойственной совпадают.</p><p>Если система имеет бесконечно много решений, условий не хватает — тогда помогает симплекс-метод.</p>'],
  en:['Solving via the dual','as in § 3.2','<p>If the primal has many variables but only two constraints, the dual has two variables. Then:</p><p>1. Write the dual and solve it graphically to find the point M.<br>2. See which lines M lies on. If M is not on line (j), then <span class="m">xⱼ = 0</span>.<br>3. If <span class="m">yᵢ ≠ 0</span>, primal constraint i is an equality.<br>4. Solve the resulting system for x. Check that the primal and dual values coincide.</p><p>If the system has infinitely many solutions, the conditions aren’t enough, and the simplex method helps.</p>']},
 {id:'excel',ru:['Термины Excel','окончательные значения, теневые цены, допуски','<p>Так называются числа из отчёта «Поиска решения» (определение 4):</p><p><b>Окончательные значения</b> — оптимальные <span class="m">x₁, …, xₙ</span>.<br><b>Теневые цены</b> — оптимальные двойственные переменные <span class="m">y₁, …, yₘ</span>: на сколько вырастет оптимум, если ресурс i увеличить на единицу.<br><b>Допуски</b> — запасы в ограничениях, <span class="m">bᵢ − (aᵢ, x)</span>.<br><b>Приведённые стоимости</b> — остатки двойственных ограничений: насколько товар j «недоплачивает», чтобы его стало выгодно выпускать.</p>'],
  en:['Excel terms','final values, shadow prices, slacks','<p>These are the numbers in the Solver report (Definition 4):</p><p><b>Final values</b> are the optimal <span class="m">x₁, …, xₙ</span>.<br><b>Shadow prices</b> are the optimal dual variables <span class="m">y₁, …, yₘ</span>: how much the optimum grows if resource i increases by one.<br><b>Slacks</b> are the spare amounts in constraints, <span class="m">bᵢ − (aᵢ, x)</span>.<br><b>Reduced costs</b> are the residuals of the dual constraints: how much good j falls short of being worth producing.</p>']},
 {id:'reduce',ru:['Сведение к производственной задаче','теорема 3','<p>Любую задачу можно переписать в форме производственной: неравенство ⩾ умножаем на −1; равенство заменяем двумя неравенствами ⩽ и ⩾; переменную любого знака записываем разностью двух неотрицательных <span class="m">x = y − z</span>; минимум <span class="m">z → min</span> заменяем на <span class="m">−z → max</span>.</p><p>На практике удобнее сразу перейти к симплексной форме: добавить допуски и умножить строки с отрицательной правой частью на −1, как в примерах § 5.3–5.4.</p>'],
  en:['Reducing to a production problem','Theorem 3','<p>Any problem can be rewritten as a production problem: multiply a ⩾ inequality by −1; replace an equality with two inequalities ⩽ and ⩾; write a free variable as a difference of two non-negatives <span class="m">x = y − z</span>; replace <span class="m">z → min</span> with <span class="m">−z → max</span>.</p><p>In practice it is easier to go straight to simplex form: add slacks and multiply rows with a negative right-hand side by −1, as in the examples of § 5.3–5.4.</p>']},
 {id:'simplexform',ru:['Симплексная форма и допуски','определение 5','<p>Каждое неравенство превращаем в равенство, добавляя неотрицательную переменную — <b>допуск</b>: к ⩽ прибавляем, из ⩾ вычитаем. Например, <span class="m">x₁ + 2x₂ ⩽ 1</span> становится <span class="m">x₁ + 2x₂ + x₄ = 1</span>, <span class="m">x₄ ⩾ 0</span>.</p><p>Затем добиваемся, чтобы все правые части были неотрицательны (умножая строки на −1). Важно, чтобы ранг матрицы был максимальным, иначе единичной матрицы не построить.</p>'],
  en:['Simplex form and slacks','Definition 5','<p>Each inequality becomes an equality by adding a non-negative variable, a <b>slack</b>: added to ⩽, subtracted from ⩾. For example, <span class="m">x₁ + 2x₂ ⩽ 1</span> becomes <span class="m">x₁ + 2x₂ + x₄ = 1</span>, <span class="m">x₄ ⩾ 0</span>.</p><p>Then make all right-hand sides non-negative (multiplying rows by −1). The matrix rank must be maximal, otherwise the identity matrix can’t be built.</p>']},
 {id:'tableau',ru:['Симплекс-таблица','большой блок, нижняя строка','<p>Строки таблицы — ограничения: коэффициенты (это «большой блок») и правая часть b. Нижняя строка — коэффициенты целевой функции с обратным знаком, а в углу — её значение.</p><p>Сначала в большом блоке создают <b>единичную матрицу</b> m × m: переменные над её столбцами — базисные, они равны правым частям, остальные — нулю. Это вершина допустимого множества. Каждый шаг метода Гаусса переводит к соседней вершине.</p>'],
  en:['Simplex tableau','main block, bottom row','<p>Rows are constraints: coefficients (the “main block”) and the right-hand side b. The bottom row holds the objective coefficients with the opposite sign, and the corner holds its value.</p><p>First an <b>identity matrix</b> m × m is built in the main block: variables above its columns are basic and equal the right-hand sides; the others are zero. That is a vertex of the feasible set. Each Gaussian step moves to a neighbouring vertex.</p>']},
 {id:'pivot',ru:['Разрешающий элемент','правило минимального отношения','<p>Выбрав столбец r, смотрим на его положительные элементы и для каждого считаем отношение <span class="m">bⱼ / aⱼᵣ</span>. Разрешающий элемент — тот, где отношение минимально. Это гарантирует, что правые части останутся неотрицательными, то есть мы не выйдем из допустимого множества.</p><p>Строку разрешающего элемента делим на него, а остальные элементы столбца обнуляем методом Гаусса — вычитая кратные этой строки.</p>'],
  en:['Pivot element','minimum ratio rule','<p>Having chosen column r, look at its positive entries and compute <span class="m">bⱼ / aⱼᵣ</span> for each. The pivot is where the ratio is smallest. This keeps the right-hand sides non-negative, so we don’t leave the feasible set.</p><p>Divide the pivot row by the pivot and clear the other entries of the column by Gaussian elimination, subtracting multiples of that row.</p>']},
 {id:'optimality',ru:['Условие оптимальности','теорема 4','<p>Если после построения единичной матрицы в нижней строке нет отрицательных чисел, решение оптимально: базисные переменные равны правым частям, максимум стоит в углу.</p><p>Иначе выбираем отрицательное число, наибольшее по модулю, — его столбец входит в базис. Если в этом столбце нет положительных элементов, целевая функция неограниченно растёт и максимума нет.</p><p>Если значение не растёт (вырожденный шаг), нужно следить, чтобы не вернуться к прежней таблице — иначе возможно зацикливание.</p>'],
  en:['Optimality condition','Theorem 4','<p>If, once the identity matrix is built, the bottom row has no negative numbers, the solution is optimal: basic variables equal the right-hand sides, and the maximum is in the corner.</p><p>Otherwise pick the negative number largest in absolute value; its column enters the basis. If that column has no positive entries, the objective grows without bound and there is no maximum.</p><p>If the value doesn’t increase (a degenerate step), make sure not to return to an earlier tableau, or cycling may occur.</p>']},
 {id:'uniqueness',ru:['Единственность решения','теорема 5','<p>Если в оптимальной таблице нули нижней строки стоят только под базисными переменными, решение единственно.</p><p>В терминах Excel: каждому нулевому окончательному значению соответствует ненулевая приведённая стоимость, а каждому нулевому допуску — ненулевая теневая цена.</p><p>Если условие не выполняется, решений может быть много — их ищут по § 5.5.</p>'],
  en:['Uniqueness of the solution','Theorem 5','<p>If in the optimal tableau the zeros of the bottom row stand only under basic variables, the solution is unique.</p><p>In Excel terms: every zero final value has a non-zero reduced cost, and every zero slack has a non-zero shadow price.</p><p>If the condition fails, there may be many solutions; they are found as in § 5.5.</p>']},
 {id:'allsol',ru:['Поиск всех решений','§ 5.5, теорема 6','<p>Смотрим на каждый ноль нижней строки под небазисной переменной. Если в его столбце есть положительный элемент, делаем шаг метода Гаусса: значение не изменится, а вершина может оказаться новой. Пробуем все такие элементы (при равных отношениях — каждый).</p><p>Если в столбце все элементы ⩽ 0, переменная может расти бесконечно — получается <b>луч</b> решений: базисные переменные выражаем через неё.</p><p>Итог: все решения — выпуклые комбинации оптимальных вершин плюс неотрицательные кратные лучей: <span class="m">X = α₁X₁ + … + αᵣXᵣ + t·d</span>.</p>'],
  en:['Finding all solutions','§ 5.5, Theorem 6','<p>Look at each zero of the bottom row under a non-basic variable. If its column has a positive entry, take a Gaussian step: the value won’t change, but the vertex may be new. Try every such entry (each one when ratios tie).</p><p>If all entries in the column are ⩽ 0, the variable can grow without bound, giving a <b>ray</b> of solutions: express the basic variables through it.</p><p>Result: all solutions are convex combinations of optimal vertices plus non-negative multiples of rays: <span class="m">X = α₁X₁ + … + αᵣXᵣ + t·d</span>.</p>']},
 {id:'integer',ru:['Целочисленная оптимизация','§ 5.6','<p>Если переменные обязаны быть целыми, сначала решают задачу без этого требования. Если среди её решений есть целое — оно и ответ.</p><p>Иначе требование целочисленности существенно, и задача трудная. В учебнике её решают компьютером (Excel, lpsolve), добавляя ограничения вроде <span class="m">x₁ ⩽ 2</span> или <span class="m">x₁ ⩾ 4</span>, чтобы проверить, нет ли других решений. Здесь для двух переменных перебираются все целые точки множества — видно и оптимум, и все равноценные точки.</p>'],
  en:['Integer optimization','§ 5.6','<p>If variables must be integers, first solve the problem without that requirement. If one of its solutions is an integer point, it is the answer.</p><p>Otherwise integrality matters, and the problem is hard. The textbook uses a computer (Excel, lpsolve), adding constraints like <span class="m">x₁ ⩽ 2</span> or <span class="m">x₁ ⩾ 4</span> to check for other solutions. Here, for two variables, all integer points of the set are tried, so you see the optimum and all equally good points.</p>']},
 {id:'stability',ru:['Устойчивость','интервалы для cⱼ, § 5.7.2','<p>Насколько можно менять коэффициент целевой функции <span class="m">cⱼ</span>, чтобы оптимальное решение (его структура) не изменилось? Ответ — интервал <span class="m">(Aⱼ, Bⱼ)</span>.</p><p>Для небазисной переменной (в задаче на max): <span class="m">Aⱼ = −∞</span>, <span class="m">Bⱼ = cⱼ + c̃ⱼ</span>. Для базисной: <span class="m">Aⱼ = cⱼ + max(−c̃ₖ/γ)</span> по положительным γ её строки, <span class="m">Bⱼ = cⱼ + min(−c̃ₖ/γ)</span> по отрицательным. Геометрически: пока градиент поворачивается в этих пределах, оптимальная вершина та же.</p>'],
  en:['Stability','ranges for cⱼ, § 5.7.2','<p>How much can an objective coefficient <span class="m">cⱼ</span> change without changing the optimal solution’s structure? The answer is a range <span class="m">(Aⱼ, Bⱼ)</span>.</p><p>For a non-basic variable (max problem): <span class="m">Aⱼ = −∞</span>, <span class="m">Bⱼ = cⱼ + c̃ⱼ</span>. For a basic one: <span class="m">Aⱼ = cⱼ + max(−c̃ₖ/γ)</span> over positive γ in its row, <span class="m">Bⱼ = cⱼ + min(−c̃ₖ/γ)</span> over negative ones. Geometrically: while the gradient turns within these limits, the optimal vertex stays the same.</p>']},
 {id:'sensitivity',ru:['Чувствительность','интервалы для bᵢ, § 5.7.3','<p>Насколько можно менять запас ресурса <span class="m">bᵢ</span>, чтобы структура решения (какие переменные положительны) не изменилась? Ответ — интервал <span class="m">(Cᵢ, Dᵢ)</span>.</p><p>Если ресурс в избытке (допуск базисный, теневая цена 0): <span class="m">Cᵢ = bᵢ − допуск</span>, <span class="m">Dᵢ = +∞</span>. Если ресурс дефицитный: интервал находится по столбцу его допуска в оптимальной таблице. Внутри интервала оптимум меняется на теневую цену за каждую единицу ресурса.</p>'],
  en:['Sensitivity','ranges for bᵢ, § 5.7.3','<p>How much can a resource stock <span class="m">bᵢ</span> change without changing the structure of the solution (which variables are positive)? The answer is a range <span class="m">(Cᵢ, Dᵢ)</span>.</p><p>If the resource is in surplus (the slack is basic, shadow price 0): <span class="m">Cᵢ = bᵢ − slack</span>, <span class="m">Dᵢ = +∞</span>. If it is scarce, the range comes from its slack column in the optimal tableau. Inside the range the optimum changes by the shadow price per unit of resource.</p>']},
 {id:'nash',ru:['Равновесие Нэша','глава 6','<p>Набор стратегий, от которого ни одному игроку невыгодно отклоняться в одиночку. Ищут через функции наилучшего ответа: для каждого игрока находят максимум его выигрыша при фиксированных стратегиях других (часто — приравнивая производную к нулю), затем решают систему.</p><p>Пример из учебника: в модели Курно с N фирмами равновесный выпуск каждой <span class="m">(M − c)/(N + 1)</span>.</p>'],
  en:['Nash equilibrium','Chapter 6','<p>A profile of strategies from which no player gains by deviating alone. Found via best-response functions: for each player maximize the payoff with others fixed (often by setting a derivative to zero), then solve the system.</p><p>Textbook example: in the Cournot model with N firms each equilibrium output is <span class="m">(M − c)/(N + 1)</span>.</p>']},
 {id:'bargain',ru:['Задача торга','решения Нэша и Калаи–Смородинского, глава 7','<p>Два игрока выбирают точку из множества M возможных выигрышей; d — что они получат, не договорившись.</p><p><b>Решение Нэша</b> — точка максимума <span class="m">(m₁ − d₁)(m₂ − d₂)</span> на M: тоже задача оптимизации, её решают линиями уровня этой функции (гиперболами). <b>Решение Калаи–Смородинского</b> — точка Парето-границы на отрезке от d к «идеальной» точке.</p>'],
  en:['Bargaining problem','Nash and Kalai–Smorodinsky solutions, Chapter 7','<p>Two players choose a point from a set M of possible payoffs; d is what they get without agreement.</p><p>The <b>Nash solution</b> maximizes <span class="m">(m₁ − d₁)(m₂ − d₂)</span> over M, again an optimization problem solved with level curves (hyperbolas). The <b>Kalai–Smorodinsky solution</b> is the Pareto-frontier point on the segment from d to the “ideal” point.</p>']},
 {id:'shapley',ru:['Ядро и вектор Шепли','кооперативные игры, глава 8','<p>В кооперативной игре коалиции получают выигрыш <span class="m">v(K)</span>, и его нужно поделить. <b>Ядро</b> — дележи, при которых ни одной коалиции невыгодно отделиться: система линейных неравенств, то есть снова допустимое множество.</p><p><b>Вектор Шепли</b> — средний вклад игрока по всем порядкам присоединения. <b>Преднуклеолус</b> находят последовательностью задач линейной оптимизации (алгоритм Машлера–Пелега–Шепли).</p>'],
  en:['Core and Shapley value','cooperative games, Chapter 8','<p>In a cooperative game coalitions earn <span class="m">v(K)</span>, which must be shared. The <b>core</b> is the set of allocations no coalition wants to leave: a system of linear inequalities, again a feasible set.</p><p>The <b>Shapley value</b> is a player’s average contribution over all joining orders. The <b>prenucleolus</b> is found by a sequence of linear optimization problems (the Maschler–Peleg–Shapley algorithm).</p>']}
];
const FORMAL={
 kant1:{ru:'<p><b>Теорема 1.</b> Для задач <span class="m">(c, x) → max, Ax ⩽ b, x ⩾ 0</span> и <span class="m">(b, y) → min, Aᵀy ⩾ c, y ⩾ 0</span>:</p><p>1) прямая имеет решение ⇔ допустимые множества обеих задач непусты;<br>2) если допустимые x, y таковы, что <span class="m">(c, x) = (b, y)</span>, то x и y — решения;<br>3) если x — решение прямой, то двойственная имеет решение y и <span class="m">(c, x) = (b, y)</span>.</p><p>Ключевой факт: для любых допустимых x, y верно <span class="m">(c, x) ⩽ (Aᵀy, x) = (y, Ax) ⩽ (b, y)</span> — слабая двойственность.</p>',
  en:'<p><b>Theorem 1.</b> For <span class="m">(c, x) → max, Ax ⩽ b, x ⩾ 0</span> and <span class="m">(b, y) → min, Aᵀy ⩾ c, y ⩾ 0</span>:</p><p>1) the primal has a solution ⇔ both feasible sets are non-empty;<br>2) if feasible x, y satisfy <span class="m">(c, x) = (b, y)</span>, they are solutions;<br>3) if x solves the primal, the dual has a solution y and <span class="m">(c, x) = (b, y)</span>.</p><p>The key fact: for any feasible x, y, <span class="m">(c, x) ⩽ (Aᵀy, x) = (y, Ax) ⩽ (b, y)</span>, weak duality.</p>'},
 kant2:{ru:'<p><b>Теорема 2.</b> Допустимые x и y — решения прямой и двойственной задач тогда и только тогда, когда для всех j, i:</p><p><span class="m">xⱼ(a₁ⱼy₁ + … + aₘⱼyₘ − cⱼ) = 0</span>, <span class="m">yᵢ(aᵢ₁x₁ + … + aᵢₙxₙ − bᵢ) = 0</span>.</p><p>Обозначив допуски <span class="m">xₙ₊ᵢ</span> и приведённые стоимости <span class="m">yₘ₊ⱼ</span>, получаем <span class="m">xⱼyₘ₊ⱼ = 0</span>, <span class="m">yᵢxₙ₊ᵢ = 0</span>.</p><p><b>Пример § 3.2.</b> Двойственная даёт M = (2,5; 3), M не на прямой (1) ⇒ x₁ = 0; y₁, y₂ &gt; 0 ⇒ оба ограничения прямой — равенства: 2x₂ = 1, −x₂ + x₃ = 2 ⇒ x = (0; 0,5; 2,5), max = 8,5.</p>',
  en:'<p><b>Theorem 2.</b> Feasible x and y solve the primal and dual if and only if for all j, i:</p><p><span class="m">xⱼ(a₁ⱼy₁ + … + aₘⱼyₘ − cⱼ) = 0</span>, <span class="m">yᵢ(aᵢ₁x₁ + … + aᵢₙxₙ − bᵢ) = 0</span>.</p><p>With slacks <span class="m">xₙ₊ᵢ</span> and reduced costs <span class="m">yₘ₊ⱼ</span>: <span class="m">xⱼyₘ₊ⱼ = 0</span>, <span class="m">yᵢxₙ₊ᵢ = 0</span>.</p><p><b>Example § 3.2.</b> The dual gives M = (2.5; 3), M is not on line (1) ⇒ x₁ = 0; y₁, y₂ &gt; 0 ⇒ both primal constraints are equalities: 2x₂ = 1, −x₂ + x₃ = 2 ⇒ x = (0; 0.5; 2.5), max = 8.5.</p>'},
 optimality:{ru:'<p><b>Теорема 4.</b> Пусть в симплекс-таблице создана единичная матрица m × m, нижняя строка <span class="m">c̃₁, …, c̃ₙ₊ₘ</span>, в углу M. Если все <span class="m">c̃ⱼ ⩾ 0</span>, найдено оптимальное решение: базисные переменные равны правым частям, остальные нули, максимум равен M.</p><p>Иначе выбирают <span class="m">c̃ᵣ &lt; 0</span>, наибольшее по модулю. Если все <span class="m">ãᵢᵣ ⩽ 0</span>, максимума нет. Иначе разрешающий элемент — тот <span class="m">ãₛᵣ &gt; 0</span>, где минимально <span class="m">b̃ₛ/ãₛᵣ</span>.</p>',
  en:'<p><b>Theorem 4.</b> Suppose the tableau has an m × m identity matrix, bottom row <span class="m">c̃₁, …, c̃ₙ₊ₘ</span> and corner M. If all <span class="m">c̃ⱼ ⩾ 0</span>, the solution is optimal: basic variables equal the right-hand sides, others are zero, the maximum is M.</p><p>Otherwise pick <span class="m">c̃ᵣ &lt; 0</span> largest in absolute value. If all <span class="m">ãᵢᵣ ⩽ 0</span>, there is no maximum. Otherwise the pivot is the <span class="m">ãₛᵣ &gt; 0</span> with the smallest <span class="m">b̃ₛ/ãₛᵣ</span>.</p>'},

  en:'<p><b>Theorem 6.</b> Let <span class="m">X₁, …, Xᵣ</span> be all optimal vertices, and suppose every zero of the bottom row under a non-basic variable has a positive entry above it. Then X is optimal ⇔ <span class="m">X = α₁X₁ + … + αᵣXᵣ</span>, <span class="m">αᵢ ∈ [0, 1]</span>, <span class="m">Σαᵢ = 1</span>.</p><p><b>Example § 5.5.2.</b> Column x₂ with a zero at the bottom has only negative entries ⇒ a ray: <span class="m">x = (1/3; 0; 5/3) + α(1/3; 1; 2/3)</span>, α ⩾ 0, max = −2.</p>'},

  en:'<p><b>Example 1 (§ 4.1).</b> <span class="m">4x₁ + x₂ → min</span>; <span class="m">3x₁ + x₂ = 3</span>, <span class="m">4x₁ + 3x₂ ⩾ 6</span>, <span class="m">x₁ + 2x₂ ⩽ 4</span>, <span class="m">x ⩾ 0</span>.</p><p>Equality ⇒ y₁ free; ⩾ with min ⇒ y₂ ⩾ 0; ⩽ with min ⇒ y₃ ⩽ 0. x ⩾ 0 and the dual is max ⇒ constraints ⩽:</p><p><span class="m">3y₁ + 6y₂ + 4y₃ → max</span>; <span class="m">3y₁ + 4y₂ + y₃ ⩽ 4</span>, <span class="m">y₁ + 3y₂ + 2y₃ ⩽ 1</span>, <span class="m">y₂ ⩾ 0, y₃ ⩽ 0</span>.</p>'},
 sensitivity:{ru:'<p><b>Формулы § 5.7.3.</b> Если <span class="m">yᵢ</span> соответствует базисному допуску <span class="m">xₙ₊ᵢ</span>: для ⩽ <span class="m">Cᵢ = bᵢ − xₙ₊ᵢ</span>, <span class="m">Dᵢ = +∞</span>. Если небазисному: <span class="m">Cᵢ = bᵢ + max(−x̃ⱼ/πⱼᵢ)</span> по <span class="m">πⱼᵢ &gt; 0</span>, <span class="m">Dᵢ = bᵢ + min(−x̃ⱼ/πⱼᵢ)</span> по <span class="m">πⱼᵢ &lt; 0</span>, где π — столбец допуска в оптимальной таблице, x̃ — правые части.</p><p>Замечание 15: при вырождении (нулевые правые части) интервалы могут быть уже настоящих.</p>',
  en:'<p><b>Formulas of § 5.7.3.</b> If <span class="m">yᵢ</span> matches a basic slack <span class="m">xₙ₊ᵢ</span>: for ⩽ <span class="m">Cᵢ = bᵢ − xₙ₊ᵢ</span>, <span class="m">Dᵢ = +∞</span>. If non-basic: <span class="m">Cᵢ = bᵢ + max(−x̃ⱼ/πⱼᵢ)</span> over <span class="m">πⱼᵢ &gt; 0</span>, <span class="m">Dᵢ = bᵢ + min(−x̃ⱼ/πⱼᵢ)</span> over <span class="m">πⱼᵢ &lt; 0</span>, where π is the slack column of the optimal tableau and x̃ the right-hand sides.</p><p>Remark 15: under degeneracy (zero right-hand sides) the ranges may be narrower than the true ones.</p>'}

    else if(k==='poly'){const[pts,col,op]=a;lastPoly=pts;out+=`<polygon points="${pts.map(p=>F(X(p[0]))+','+F(Y(p[1]))).join(' ')}" fill="${c(col)}" fill-opacity="${op}" stroke="${c(col)}" stroke-width="1.4"/>`}
    else if(k==='ln'){const[A,B,C,col,dash]=a,sg=seg(A,B,C);if(sg)out+=`<line x1="${F(X(sg[0][0]))}" y1="${F(Y(sg[0][1]))}" x2="${F(X(sg[1][0]))}" y2="${F(Y(sg[1][1]))}" stroke="${c(col)}" stroke-width="1.8"${dash?' stroke-dasharray="6 4"':''}/>`}
    else if(k==='seg'){const[x1,y1,x2,y2,col,w]=a;out+=`<line x1="${F(X(x1))}" y1="${F(Y(y1))}" x2="${F(X(x2))}" y2="${F(Y(y2))}" stroke="${c(col)}" stroke-width="${w||2}" stroke-linecap="round"/>`}
    else if(k==='arrow'){const[x1,y1,x2,y2,col,op=1]=a,ang=Math.atan2(-(y2-y1),x2-x1),hx=X(x2),hy=Y(y2);out+=`<g opacity="${op}"><line x1="${F(X(x1))}" y1="${F(Y(y1))}" x2="${F(hx)}" y2="${F(hy)}" stroke="${c(col)}" stroke-width="2.6"/><polygon points="${F(hx)},${F(hy)} ${F(hx-9*Math.cos(ang-.4))},${F(hy-9*Math.sin(ang-.4))} ${F(hx-9*Math.cos(ang+.4))},${F(hy-9*Math.sin(ang+.4))}" fill="${c(col)}"/></g>`}
    else if(k==='pt'){const[x,y,col,r=3.5]=a;out+=`<circle cx="${F(X(x))}" cy="${F(Y(y))}" r="${r}" fill="${c(col)}" stroke="var(--s-bg)" stroke-width="1.5"/>`}
    else if(k==='ints'){const[x0,x1,y0,y1]=a;const inP=(px,py)=>{let ins=false;const p=lastPoly;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>py)!==(p[j][1]>py))&&(px<(p[j][0]-p[i][0])*(py-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))ins=!ins}return ins};
      for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)if(lastPoly&&inP(x+1e-6,y+1e-6))out+=`<circle cx="${F(X(x))}" cy="${F(Y(y))}" r="2" fill="${c('int')}"/>`}
    else if(k==='t'){const[x,y,t,col,sz]=a;out+=tx(X(x),Y(y),t,col,sz)}
    else if(k==='T'){const[x,y,t,col,sz]=a;out+=tx(x,y,t,col,sz)}
    else if(k==='raw')out+=a[0]}
  return`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="${W}" height="${H}" fill="var(--s-bg)"/>${out}</svg>`}
function runDemo(id){const d=DEMOS[id];if(!d)return;if(d.show){Object.assign(P.show,DEF.show,d.show);syncToggles();save()}else{let ch=false;for(const k of['gradient','level','region','lines'])if(!P.show[k]){P.show[k]=true;ch=true}if(ch){syncToggles();save()}}
  loadPreset(d.p);if(d.view&&d.view!==S.view)setView(d.view);showPanel(d.panel||'solve');if(d.play)setTimeout(play,350)}

/* ---------- экспорт текста ---------- */
function texLin(a,names,c0){let s='';a.forEach((q,j)=>{if(q.z)return;const neg=q.s<0,abs=q.abs();const co=abs.eq(Q1)?'':(abs.d===1?String(abs.n):`\\frac{${abs.n}}{${abs.d}}`);const nm=names[j].replace(/^([a-zA-Z]+)_?(\d+)('*)$/,'$1_{$2}$3');s+=(s?(neg?' - ':' + '):(neg?'-':''))+co+nm});
  if(c0&&!c0.z){const ab=c0.abs();s+=(s?(c0.s<0?' - ':' + '):(c0.s<0?'-':''))+(ab.d===1?ab.n:`\\frac{${ab.n}}{${ab.d}}`)}return s||'0'}
const texQ=q=>(q.s<0?'-':'')+(q.d===1?Math.abs(q.n):`\\frac{${Math.abs(q.n)}}{${q.d}}`);
const texOp=o=>o==='<='?'\\le':o==='>='?'\\ge':'=';
function texProb(G,zn){const L=[`${zn} = ${texLin(G.c,G.vars,G.c0)} \\to \\${G.sense}`];G.cons.forEach(c=>L.push(`${texLin(c.a,G.vars)} ${texOp(c.op)} ${texQ(c.b)}`));
  const ge=G.vars.filter((_,j)=>G.sign[j]==='ge'),le=G.vars.filter((_,j)=>G.sign[j]==='le');const t=v=>v.map(n=>n.replace(/^([a-zA-Z]+)_?(\d+)$/,'$1_{$2}')).join(', ');
  return`\\begin{cases} ${L.join(' \\\\ ')}${ge.length?` \\\\ ${t(ge)} \\ge 0`:''}${le.length?` \\\\ ${t(le)} \\le 0`:''} \\end{cases}`}
function renderTex(){const ta=$('#xTex');if(S.err||!S.P){ta.value='';return}const P0=S.P,r=S.rP;
  if(fmtMode==='tex'){let s=`% ${T().p_problem}\n${texProb(P0,'z')}\n% ${T().d_head}\n${texProb(S.D,'w')}\n`;if(r&&r.status==='optimal')s+=`\\${P0.sense} z = ${texQ(r.value)},\\quad x = \\left(${r.x.map(texQ).join('; ')}\\right)`;ta.value=s}
  else if(fmtMode==='np'){const n=P0.vars.length,A=[],b=[],Ae=[],be=[];P0.cons.forEach(c=>{const row=c.a.map(q=>q.v);if(c.op==='<='){A.push(row);b.push(c.b.v)}else if(c.op==='>='){A.push(row.map(v=>-v));b.push(-c.b.v)}else{Ae.push(row);be.push(c.b.v)}});
    const bd=P0.sign.map((s,j)=>P0.bin[j]?'(0, 1)':s==='ge'?'(0, None)':s==='le'?'(None, 0)':'(None, None)');const cc=P0.c.map(q=>(P0.sense==='max'?-1:1)*q.v);const J=x=>JSON.stringify(x);
    ta.value=`from scipy.optimize import linprog\n# ${P0.sense}: ${T().pyMin}${P0.sense==='max'?T().pyNeg:''}\nc = ${J(cc)}\nA_ub = ${A.length?J(A):'None'}\nb_ub = ${b.length?J(b):'None'}\nA_eq = ${Ae.length?J(Ae):'None'}\nb_eq = ${be.length?J(be):'None'}\nbounds = [${bd.join(', ')}]\n${P0.int.some(Boolean)?`integrality = ${J(P0.int.map(v=>v?1:0))}\n`:''}res = linprog(c, A_ub=A_ub, b_ub=b_ub, A_eq=A_eq, b_eq=b_eq, bounds=bounds${P0.int.some(Boolean)?', integrality=integrality':''})\nprint(res.x, ${P0.sense==='max'?'-':''}res.fun${P0.c0.z?'':` + ${P0.c0.v}`})`}
  else{let s=probText(P0)+'\n\n';if(r&&r.status==='optimal')s+=`${P0.sense} z = ${qT(r.value)}\nx = ${ptT(r.x)}`;else if(r)s+=textOf();ta.value=s}}

/* ---------- горячие клавиши ---------- */
const KEYS=[['Space','k_play'],['← →','k_t'],['Shift + ← →','k_t2'],['Home / End','k_t01'],['1 – 9','k_pre'],['D','k_mode'],['V','k_grad'],['L','k_level'],['B','k_vert'],['R','k_sides'],['G','k_grid'],['H','k_hint'],['+ / −','k_zoom'],['0','k_home'],['S','k_png'],['A','k_vid'],['/','k_gloss'],['?','k_keys'],['Esc','k_esc']];
function renderKeys(){const L=T();$('#keysList').innerHTML=KEYS.map(([k,d])=>`<span>${k.split(' ').map((p,i)=>i>0&&/^[+\/–]$/.test(p)?p:`<kbd>${p}</kbd>`).join(' ')}</span><span>${L[d]}</span>`).join('')}
function openKeys(){renderKeys();closeDrawers();openDrawer('dKeys')}
$('#openKeys').onclick=openKeys;$('#openKeys2').onclick=openKeys;
function toast(msg,ms=1600){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms)}
function flip(k){P.show[k]=!P.show[k];syncToggles();save();renderCaption();req();const L=T();toast(`${L.tog[k]}: ${P.show[k]?L.on:L.off}`)}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target,tag=tg&&tg.tagName;
  if((tag==='INPUT'&&!['checkbox','range','radio','color'].includes(tg.type))||tag==='TEXTAREA'||tag==='SELECT'||(tg&&tg.isContentEditable))return;
  const isQ=e.key==='?'||(e.code==='Slash'&&e.shiftKey);if(document.querySelector('.drawer.open')&&!isQ)return;
  const c=e.code,L=T();let h=true;const setT=v=>{S.anim=null;S.t=Math.max(0,Math.min(1,v));setZfromT();renderCaption();req()};
  if(isQ)openKeys();else if(c==='Space')play();
  else if(c==='ArrowLeft'||c==='ArrowRight'){const st=e.shiftKey?.25:.05;setT(S.t+(c==='ArrowLeft'?-st:st))}
  else if(c==='Home')setT(0);else if(c==='End')setT(1);
  else if(/^(Digit|Numpad)[1-9]$/.test(c)){const p=PRE[+c.slice(-1)-1];if(p){loadPreset(p[0]);toast(L.pre[p[0]])}}
  else if(c==='Digit0'||c==='Numpad0')fitView();
  else if(c==='KeyD'){setView(S.view==='P'?'D':'P')}
  else if(c==='KeyV')flip('gradient');else if(c==='KeyL')flip('level');else if(c==='KeyB')flip('vertices');else if(c==='KeyR')flip('sides');else if(c==='KeyG')flip('bgGrid');else if(c==='KeyH')flip('hints');
  else if(c==='Equal'||c==='NumpadAdd')$('#zIn').click();else if(c==='Minus'||c==='NumpadSubtract')$('#zOut').click();
  else if(c==='KeyS'){if(canSave())exportPng();else toast(L.xNoDl)}
  else if(c==='KeyA'){if(canSave()&&vidMime())exportVideo();else toast(canSave()?L.xNoVid:L.xNoDl)}
  else if(c==='Slash'){$('#openGloss').click();setTimeout(()=>$('#gq').focus(),30)}else h=false;
  if(h)e.preventDefault()});
/* ---------- настройки ---------- */
$('#openSet').onclick=()=>{syncSettings();openDrawer('dSet')};
function buildSettings(){
  document.querySelectorAll('#langSeg button,#langSeg2 button').forEach(b=>b.onclick=()=>{P.lang=b.dataset.l;applyLang();save()});
  document.querySelectorAll('#uiSeg button').forEach(b=>b.onclick=()=>{P.ui=b.dataset.v;applyPrefs()});
  document.querySelectorAll('#dockSeg button').forEach(b=>b.onclick=()=>{P.dock=b.dataset.v;applyPrefs()});
  $('#wR').oninput=e=>{P.width=+e.target.value;applyPrefs()};
  $('#hR').oninput=e=>{P.bottomH=+e.target.value;applyPrefs()};
  $('#fR').oninput=e=>{P.font=+e.target.value;applyPrefs()};
  $('#lR').oninput=e=>{P.lw=+e.target.value;applyPrefs()};
  $('#resetOrder').onclick=()=>{P.order=PANELS.slice();P.collapsed={};applyPrefs()};
  $('#resetAll').onclick=()=>{const lg=P.lang,rd=P.read,last=P.last;P=clone(DEF);P.lang=lg;P.read=rd||{};P.last=last;syncToggles();$('#spR').value=P.speed;$('#spOut').textContent='×1';applyPrefs();renderAll()};
}
function buildPal(){const L=T();
  const pc=$('#palChips');pc.innerHTML='';Object.entries(PAL).forEach(([k,p])=>{const b=document.createElement('button');b.className='chip';b.dataset.p=k;b.innerHTML=`<span class="sw" style="background:${p.bg};box-shadow:inset 0 0 0 3px ${p.f}"></span>${L.pal[k]}`;
    b.onclick=()=>{P.palette=k;P.colors={...PAL[k]};applyPrefs()};pc.appendChild(b)});
  const cs=$('#colors');cs.innerHTML='';Object.keys(L.colors).forEach(k=>{const l=document.createElement('label');l.innerHTML=`<input type="color" data-k="${k}"> ${L.colors[k]}`;
    l.querySelector('input').oninput=e=>{P.colors[k]=e.target.value;P.palette='custom';applyPrefs()};cs.appendChild(l)});
}
function applyLang(){const L=T();LNG=P.lang;document.documentElement.lang=P.lang;document.title=L.title;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=L[e.dataset.i]});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=L[e.dataset.ih]});
  document.querySelectorAll('[data-it]').forEach(e=>{e.title=L[e.dataset.it];e.setAttribute('aria-label',L[e.dataset.it])});
  document.querySelectorAll('[data-ia]').forEach(e=>{e.setAttribute('aria-label',L[e.dataset.ia])});
  $('#gq').placeholder=L.search;cv.setAttribute('aria-label',L.canvas);
  document.querySelectorAll('#langSeg button,#langSeg2 button').forEach(b=>b.classList.toggle('on',b.dataset.l===P.lang));
  buildPal();buildToggles();syncToggles();syncSettings();updExport();renderKeys();
  if($('#dGloss').classList.contains('open'))rerenderGloss();
  if(S.txt){solveAll({keepT:true})}syncStyle()}
function syncSettings(){
  document.querySelectorAll('#uiSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===P.ui));
  document.querySelectorAll('#dockSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===P.dock));
  document.querySelectorAll('#palChips .chip').forEach(b=>b.classList.toggle('on',b.dataset.p===P.palette));
  document.querySelectorAll('#colors input').forEach(i=>{i.value=P.colors[i.dataset.k]});
  $('#wR').value=P.width;$('#wOut').textContent=P.width+' px';$('#hR').value=P.bottomH;$('#hOut').textContent=P.bottomH+' %';
  $('#fR').value=P.font;$('#fOut').textContent=P.font+' %';$('#lR').value=P.lw;$('#lOut').textContent='×'+fmt(P.lw,1)}
function effDock(){return P.dock==='auto'?(innerWidth<760?'bottom':'right'):P.dock}
function applyDock(){const d=effDock();main.dataset.dock=d;
  if(d==='float'){const mr=main.getBoundingClientRect(),sw=side.offsetWidth||P.width;P.float.x=Math.max(8,Math.min(P.float.x,mr.width-Math.min(sw,mr.width)-8));P.float.y=Math.max(8,Math.min(P.float.y,mr.height-80));side.style.left=P.float.x+'px';side.style.top=P.float.y+'px'}
  else{side.style.left='';side.style.top=''}}
function applyPrefs(){
  const r=document.documentElement;if(P.ui==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',P.ui);
  r.style.fontSize=(16*P.font/100)+'px';r.style.setProperty('--side-w',P.width+'px');r.style.setProperty('--side-h',P.bottomH+'%');
  Object.entries(P.colors).forEach(([k,v])=>r.style.setProperty('--s-'+k,v));
  applyDock();applyOrder();syncSettings();save();req()}
(()=>{const g=$('#grip');let st=null;
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,fx:P.float.x,fy:P.float.y}});
  g.addEventListener('pointermove',e=>{if(!st)return;P.float.x=st.fx+e.clientX-st.x;P.float.y=st.fy+e.clientY-st.y;applyDock()});
  const end=()=>{if(st){st=null;save()}};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end)})();
window.addEventListener('resize',()=>applyDock());

/* ---------- старт ---------- */
buildPanels();buildSettings();
$('#spR').value=P.speed;$('#spOut').textContent='×'+fmt(P.speed);
applyPrefs();
{const l=P.last;if(l&&typeof l.txt==='string'&&l.txt.trim()){S.txt=l.txt;S.preset=l.p||null;$('#pIn').value=l.txt;try{solveAll({autoView:true,fit:true})}catch(e){loadPreset('prod')}}else loadPreset('prod')}
applyLang();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitView();req()});
})();
</script>

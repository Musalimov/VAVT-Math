<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linear algebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" data-ih="brand"></div>
    <div class="spacer"></div>
    <div class="seg" id="langSeg"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
    <div class="seg" id="modeSeg"><button data-mode="2d" class="on">2D</button><button data-mode="3d">3D</button></div>
    <button class="btn ghost" id="openGloss" data-it="glossT"><span class="ic">?</span><span class="lbl" data-i="gloss"></span></button>
    <button class="btn ghost hk" id="openKeys" data-it="keys"><span class="ic">⌨</span></button>
    <button class="btn ghost" id="openSet" data-it="settings"><span class="ic">⚙</span><span class="lbl" data-i="settings"></span></button>
  </header>
  <div class="main" id="main">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="ov" id="ov"></div>
      <div class="zoom"><button id="zIn" data-it="zIn">+</button><button id="zOut" data-it="zOut">−</button><button id="zHome" data-it="zHome">⌂</button></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <button class="capOpen" id="capOpen" hidden><span aria-hidden="true">💡</span><span data-i="capOpen"></span></button>
      <div class="cap" id="cap"><span id="capT"></span><button id="capX" data-it="capX">×</button></div>
    </div>
    <aside class="side" id="side">
      <div class="grip" id="grip" data-i="grip"></div>
      <section class="panel" data-id="matrix">
        <div class="pb">
          <div class="shapebar"><span class="note" style="margin:0" data-i="shapeL"></span><div class="seg" id="shapeSeg"></div></div>
          <div class="matwrap"><div class="mat" id="matIn"></div></div>
          
          <div class="row"><button class="btn sm" id="bT" data-i="bT"></button><button class="btn sm" id="bInv" data-i="bInv"></button><button class="btn sm" id="bI" data-i="bI"></button></div>
          <details class="more"><summary data-i="cbMore"></summary><p class="note"><span data-ih="matNote"></span><button class="q" data-term="matrix">?</button></p></details>
        </div>
      </section>
      <section class="panel" data-id="presets">
        <div class="pb">
          <div class="chips" id="pre"></div>
          <label class="chk"><input type="checkbox" id="compose"> <span data-i="compose"></span><button class="q" data-term="composition">?</button></label>
          <div class="hist" id="hist"></div>
        </div>
      </section>
      <section class="panel" data-id="anim">
        <div class="pb">
          <div class="row" style="margin-top:.2rem"><button class="btn primary" id="bPlay" data-i="play"></button><button class="btn sm" id="bZero" data-i="zero"></button><button class="btn sm" id="bOne" data-i="one"></button></div>
          <label class="rng"><span data-i="progress"></span><output id="tOut">1</output><input type="range" id="tR" min="0" max="1000" value="1000"></label>
          <label class="rng"><span data-i="speed"></span><output id="spOut"></output><input type="range" id="spR" min="0.25" max="3" step="0.05"></label>
        </div>
      </section>
      <section class="panel" data-id="props">
        <div class="pb"><div class="props" id="props"></div></div>
      </section>
      <section class="panel" data-id="vector">
        <div class="pb">
          <div class="vin" id="vIn"></div>
          <div class="vout" id="vOut"></div>
          <details class="more"><summary data-i="cbMore"></summary>
          <div class="note" id="vEq" style="margin-top:.4rem"></div>
          <div class="d2only">
            <div id="crCtl"><p class="note" style="margin:.7rem 0 .3rem" data-i="crLabel"></p><div style="display:flex;align-items:center;gap:.4rem"><div class="seg" id="slCr"><button data-cr="0" class="on" data-i="crOff"></button><button data-cr="1">x₁</button><button data-cr="2">x₂</button></div><button class="q" data-term="cramer">?</button></div></div>
            <div class="vout" id="crOut"></div>
            <p class="note" data-ih="vecNote"></p>
          </div>
          </details>
        </div>
      </section>
      <section class="panel" data-id="show">
        <div class="pb"><div class="toggles" id="tog"></div></div>
      </section>
      <section class="panel" data-id="mul">
        <div class="pb">
          <div class="mulrow"><span class="ml">A =</span><div class="mat" id="mulA"></div></div>
          <div class="mulrow"><span class="ml">B =</span><div class="mat" id="mulB"></div></div>
          <div class="mulrow"><span class="ml">A·B =</span><div class="mulres" id="mulC"></div><button class="q" data-term="composition">?</button></div>
          <details class="steps"><summary data-i="mulWhat"></summary><div data-ih="mulNote"></div><div id="mulInfo" style="margin-top:.5rem"></div></details>
          <details class="steps"><summary data-i="mulSteps"></summary><div id="mulSteps"></div></details>
          <div class="row"><button class="btn sm primary" id="mulPlay" data-i="mulPlay"></button><button class="btn sm" id="mulSwap" data-i="mulSwap"></button><button class="btn sm" id="mulTake" data-i="mulTake"></button><button class="btn sm" id="mulTo" data-i="mulTo"></button></div>
        </div>
      </section>
      <section class="panel" data-id="cob">
        <div class="pb"><div class="d3only"><p class="note" style="margin-top:.2rem" data-i="only2d"></p><button class="btn sm" data-go2d data-i="go2d"></button></div>
          <div class="d2only">
            <label class="chk" style="margin-top:.2rem"><input type="checkbox" id="cbOn"> <span data-i="onScene"></span></label>
            <div class="vin" style="margin-top:.6rem"><span class="ml" style="min-width:0">b₁ =</span><label>x<input type="text" inputmode="decimal" data-cb="b1:0" aria-label="b1 x"></label><label>y<input type="text" inputmode="decimal" data-cb="b1:1" aria-label="b1 y"></label></div>
            <div class="vin" style="margin-top:.4rem"><span class="ml" style="min-width:0">b₂ =</span><label>x<input type="text" inputmode="decimal" data-cb="b2:0" aria-label="b2 x"></label><label>y<input type="text" inputmode="decimal" data-cb="b2:1" aria-label="b2 y"></label></div>
            <div class="row"><button class="btn sm primary" id="cbEig" data-i="cbEig"></button><button class="btn sm" id="cbStd" data-i="cbStd"></button><button class="btn sm" id="cbTo" data-i="cbTo"></button></div>
            <details class="steps"><summary data-i="cbMore"></summary><div class="vout" id="cbOut"></div><p class="note" data-ih="cbNote"></p></details>
          </div>
        </div>
      </section>
      <section class="panel" data-id="export">
        <div class="pb">
          <div class="row" style="margin-top:.2rem"><button class="btn sm" id="xPng" data-i="xPng" disabled></button><button class="btn sm" id="xVid" data-i="xVid" disabled></button></div>
          <label class="chk"><input type="checkbox" id="xStamp" checked> <span data-i="xStamp"></span></label>
          <p class="note" id="xNote"></p>
          <div class="tex">
            <div class="seg" id="xFmt"><button data-f="tex" class="on">LaTeX</button><button data-f="np">NumPy</button><button data-f="txt" data-i="fmtText"></button></div>
            <textarea id="xTex" readonly rows="4" aria-label="Matrix"></textarea>
            <div class="row"><button class="btn sm" id="xCopy" data-i="xCopy"></button></div>
          </div>
        </div>
      </section>
    </aside>
  </div>
</div>

<div class="drawer" id="dGloss" role="dialog" aria-modal="true">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="sh-h"><h2 data-i="gloss"></h2><button class="icon" data-close data-it="close">✕</button></div>
    <input class="search" id="gq" type="search">
    <div id="gl"></div>
  </div>
</div>

<div class="drawer" id="dKeys" role="dialog" aria-modal="true">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="sh-h"><h2 data-i="keys"></h2><button class="icon" data-close data-it="close">✕</button></div>
    <p class="note" data-i="keysNote"></p>
    <div class="keys" id="keysList"></div>
  </div>
</div>

<div class="drawer" id="dSet" role="dialog" aria-modal="true">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="sh-h"><h2 data-i="settings"></h2><button class="icon" data-close data-it="close">✕</button></div>
    <h4 data-i="s_lang"></h4>
    <div class="seg" id="langSeg2"><button data-l="ru">Русский</button><button data-l="en">English</button></div>
    <h4 data-i="s_ui"></h4>
    <div class="seg" id="uiSeg"><button data-v="auto" data-i="ui_auto"></button><button data-v="light" data-i="ui_light"></button><button data-v="dark" data-i="ui_dark"></button></div>
    <h4 data-i="s_dock"></h4>
    <div class="seg" id="dockSeg"><button data-v="auto" data-i="d_auto"></button><button data-v="right" data-i="d_right"></button><button data-v="left" data-i="d_left"></button><button data-v="bottom" data-i="d_bottom"></button><button data-v="float" data-i="d_float"></button></div>
    <label class="rng"><span data-i="s_w"></span><output id="wOut"></output><input type="range" id="wR" min="240" max="560" step="10"></label>
    <label class="rng"><span data-i="s_h"></span><output id="hOut"></output><input type="range" id="hR" min="25" max="75" step="1"></label>
    <label class="rng"><span data-i="s_f"></span><output id="fOut"></output><input type="range" id="fR" min="80" max="130" step="5"></label>
    <label class="rng"><span data-i="s_l"></span><output id="lOut"></output><input type="range" id="lR" min="0.5" max="2.5" step="0.1"></label>
    <h4 data-i="s_pal"></h4>
    <div class="chips" id="palChips"></div>
    <p class="note" data-i="palNote"></p>
    <div class="colors" id="colors"></div>
    <h4 data-i="s_blocks"></h4>
    <p class="note" data-i="blocksNote"></p>
    <h4 data-i="keys"></h4>
    <div class="row"><button class="btn sm" id="openKeys2" data-i="showKeys"></button></div>
    <h4 data-i="s_reset"></h4>
    <div class="row"><button class="btn sm" id="resetOrder" data-i="resetOrder"></button><button class="btn sm" id="resetAll" data-i="resetAll"></button></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>

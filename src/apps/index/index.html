<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика наглядно — тренажёры для студентов ВАВТ</title>
<meta name="description" content="Интерактивные тренажёры: линейная алгебра, интегралы, методы оптимальных решений, теория вероятностей. Решения по шагам, графики, справочник.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Source+Serif+4:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" data-i="brand"></div>
    <div class="spacer"></div>
    <div class="seg" id="theme"><button data-t="light" aria-label="light">☀</button><button data-t="dark" aria-label="dark">☾</button></div>
    <div class="seg" id="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
  </header>
  <section class="hero">
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
  </section>
  <section class="grid" id="grid"></section>
  <section class="info">
    <div><h3 data-i="i1h"></h3><p data-i="i1"></p></div>
    <div><h3 data-i="i2h"></h3><p data-i="i2"></p></div>
    <div><h3 data-i="i3h"></h3><p data-i="i3"></p></div>
  </section>
  <footer><span data-i="foot"></span></footer>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>

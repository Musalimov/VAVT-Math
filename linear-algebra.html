<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linear algebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#eef1f5;--panel:#ffffff;--ink:#16202c;--muted:#5d6876;--line:#d8dee6;--chip:#e6eaf0;--accent:#1f7ea3;--accent-ink:#fff;--shadow:0 14px 40px rgba(20,30,45,.18);
  --side-w:340px;--side-h:44%;
  --s-bg:#0b0c10;--s-axis:#f2f2f2;--s-i:#83c167;--s-j:#fc6255;--s-k:#58c4dd;--s-det:#f4d345;--s-eigen:#c77dff;--s-vec:#ff9f43;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e131b;--panel:#151c27;--ink:#e6ebf2;--muted:#8d99a8;--line:#253041;--chip:#1d2633;--accent:#58c4dd;--accent-ink:#06222c;--shadow:0 14px 40px rgba(0,0,0,.5);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e131b;--panel:#151c27;--ink:#e6ebf2;--muted:#8d99a8;--line:#253041;--chip:#1d2633;--accent:#58c4dd;--accent-ink:#06222c;--shadow:0 14px 40px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.9rem;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{min-width:0;flex:0 1 auto;font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand .sub{font-style:italic;font-weight:400;color:var(--muted)}
.spacer{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.82rem;padding:.35rem .75rem;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:.42rem .75rem;cursor:pointer;font-weight:600;font-size:.84rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:.3rem .6rem;font-size:.8rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn .ic{font-family:"Source Serif 4",serif;font-size:1.05rem;line-height:1}
.main{flex:1;min-height:0;display:flex;position:relative}
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--s-bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.side{width:var(--side-w);flex:none;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:.6rem;display:flex;flex-direction:column;gap:.55rem;overscroll-behavior:contain}
.main[data-dock="left"]{flex-direction:row-reverse}
.main[data-dock="left"] .side{border-left:0;border-right:1px solid var(--line)}
.main[data-dock="bottom"]{flex-direction:column}
.main[data-dock="bottom"] .side{width:auto;height:var(--side-h);border-left:0;border-top:1px solid var(--line)}
.main[data-dock="float"] .side{position:absolute;z-index:6;width:min(var(--side-w),calc(100% - 16px));max-height:calc(100% - 16px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.grip{display:none;align-items:center;justify-content:center;gap:.4rem;color:var(--muted);font-size:.78rem;padding:.2rem 0 .1rem;cursor:move;touch-action:none;user-select:none;flex:none}
.grip::before{content:"";width:42px;height:4px;border-radius:2px;background:var(--line)}
.main[data-dock="float"] .grip{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;flex:none}
.panel.dragging{opacity:.45}
.ph{display:flex;align-items:center;gap:.2rem;padding:.35rem .35rem .35rem .25rem}
.handle{cursor:grab;color:var(--muted);padding:.2rem .3rem;user-select:none;font-size:1rem;line-height:1}
.ph h3{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;font-weight:600;flex:1;cursor:pointer;user-select:none}
.icon{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;font-size:.9rem;flex:none}
.icon:hover{background:var(--chip);color:var(--ink)}
.chev{transition:transform .15s}
.pb{padding:.15rem .8rem .8rem}
.panel.collapsed .pb{display:none}
.panel.collapsed .chev{transform:rotate(-90deg)}
.note{color:var(--muted);font-size:.8rem;line-height:1.45;margin:.55rem 0}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:.68rem;font-weight:700;cursor:pointer;vertical-align:middle;padding:0;margin-left:.2rem}
.q:hover{border-color:var(--accent);color:var(--accent)}
.ci{color:var(--s-i)}.cj{color:var(--s-j)}.ck{color:var(--s-k)}
.matwrap{display:flex;justify-content:center;padding-top:.35rem}
.mat{display:inline-grid;gap:.35rem;padding:.4rem .7rem;position:relative}
.mat::before,.mat::after{content:"";position:absolute;top:0;bottom:0;width:9px;border:2px solid var(--ink)}
.mat::before{left:0;border-right:0}
.mat::after{right:0;border-left:0}
.mat input{width:3.9rem;text-align:center;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.92rem;border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;background:var(--bg);padding:.42rem .15rem}
.mat input[data-c="0"]{border-bottom-color:var(--s-i)}
.mat input[data-c="1"]{border-bottom-color:var(--s-j)}
.mat input[data-c="2"]{border-bottom-color:var(--s-k)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.32rem .7rem;font-size:.8rem;font-weight:600;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.chk{display:flex;align-items:center;gap:.45rem;margin-top:.65rem;font-size:.84rem;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.hist{margin-top:.55rem;font-size:.8rem;color:var(--muted);line-height:1.5}
.hist b{color:var(--ink);font-weight:600}
.tex textarea{width:100%;margin-top:.6rem;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:.5rem;resize:vertical;color:var(--ink)}
.tex .row{align-items:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rel{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.8rem;font-family:"Manrope",system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;align-items:center;margin-top:.4rem}
kbd{display:inline-block;min-width:1.6rem;text-align:center;padding:.15rem .45rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--bg);font-family:"Manrope",system-ui,sans-serif;font-size:.8rem;font-weight:700;white-space:nowrap}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:.4rem .8rem;border-radius:9px;background:color-mix(in srgb,var(--s-bg) 88%,transparent);border:1px solid color-mix(in srgb,var(--s-axis) 18%,transparent);color:var(--s-axis);font-size:.85rem;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:560px),(hover:none){.hk{display:none}}
.mulrow{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.55rem}
.ml{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:1.05rem;min-width:3.4rem;text-align:right;white-space:nowrap}
#mulA input,#mulB input{width:3.3rem;font-size:.85rem}
.mulres .mini{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;padding:.15rem .6rem;gap:.15rem .8rem}
.steps summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600;margin-top:.5rem}
.steps div{font-family:"Source Serif 4",Georgia,serif;font-size:.92rem;line-height:1.7;margin-top:.3rem;overflow-x:auto}
.chap h3{display:flex;align-items:baseline;gap:.6rem;margin:1.3rem 0 .1rem;font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;font-weight:600}
.chap h3 .cnt{margin-left:auto;font-family:"Manrope",system-ui,sans-serif;font-size:.75rem;font-weight:600;color:var(--muted)}
.prog{display:flex;align-items:center;gap:.7rem;font-size:.8rem;color:var(--muted);margin:.2rem 0 .3rem}
.prog .bar{flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden;display:block}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
.rd{color:var(--accent);margin-right:.4rem}
.readbtn.on{border-color:var(--accent);color:var(--accent)}
.ill{margin:0 0 .85rem;display:flex;justify-content:center}
.ill svg{width:100%;max-width:300px;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.crm{margin-top:.35rem;font-size:.95rem;line-height:1.7}
.top .seg{flex-wrap:nowrap;flex:none}
@media (max-width:560px){#langSeg{display:none}.cap{font-size:.82rem;padding:.45rem 1.9rem .45rem .7rem}}
.more summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600;margin-top:.6rem}
.kh{position:relative;display:inline-block;line-height:1}
.kh::after{content:"";position:absolute;left:50%;top:-.13em;width:.2em;height:.2em;margin-left:-.1em;border-left:.06em solid currentColor;border-top:.06em solid currentColor;transform:rotate(45deg);pointer-events:none}
.m .kh::after,i .kh::after{margin-left:-.02em}
.shapebar{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:.15rem 0 .35rem}
.gtabs{margin:0 0 .75rem;font-family:"Manrope",system-ui,sans-serif}
.pane[hidden]{display:none}
.mm{vertical-align:middle;margin:.15rem .2rem;font-size:.92em;font-style:normal}
.rng{display:grid;grid-template-columns:1fr auto;gap:.25rem .5rem;margin-top:.7rem;font-size:.82rem;color:var(--muted)}
.rng output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.rng input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.props{display:grid;gap:.1rem}
.prop{display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;align-items:baseline;padding:.45rem 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop .k{color:var(--muted);font-size:.8rem;white-space:nowrap}
.prop .v{text-align:right;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem}
.prop .s{grid-column:1/-1;font-size:.77rem;color:var(--muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.mini{display:inline-grid;gap:.05rem .6rem;padding:.05rem .5rem;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);border-radius:4px;font-size:.88rem;text-align:right}
.vin{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.vin label{display:flex;align-items:center;gap:.3rem;font-family:"Source Serif 4",serif;font-style:italic}
.vin input{width:4rem;text-align:center;font-family:"JetBrains Mono",ui-monospace,monospace;border:1px solid var(--line);border-bottom:3px solid var(--s-vec);border-radius:8px;background:var(--bg);padding:.38rem .2rem}
.vout{margin-top:.6rem;font-family:"Source Serif 4",serif;font-size:1rem;line-height:1.55}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:.1rem .6rem}
.toggles .chk{margin-top:.35rem;font-size:.8rem}
.d3only{display:none}
body.m3 .d3only{display:revert}
body.m3 .d2only{display:none}
.ov{position:absolute;left:10px;top:10px;padding:.45rem .7rem;border-radius:10px;background:color-mix(in srgb,var(--s-bg) 82%,transparent);border:1px solid color-mix(in srgb,var(--s-axis) 16%,transparent);color:var(--s-axis);font-family:"Source Serif 4",Georgia,serif;pointer-events:none;display:flex;align-items:center;gap:.5rem}
.ov .bm{display:inline-grid;gap:.05rem .7rem;padding:.1rem .45rem;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:5px;font-size:1.02rem;text-align:right;font-variant-numeric:tabular-nums}
.ov .tt{font-size:.85rem;opacity:.75;font-style:italic}
.cap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 90px));padding:.55rem 2rem .55rem .85rem;border-radius:10px;background:color-mix(in srgb,var(--s-bg) 84%,transparent);border:1px solid color-mix(in srgb,var(--s-axis) 16%,transparent);color:var(--s-axis);font-family:"Source Serif 4",Georgia,serif;font-size:.95rem;line-height:1.4}
.cap[hidden]{display:none}
.cap button{position:absolute;right:4px;top:4px;border:0;background:transparent;color:inherit;opacity:.6;font-size:1.1rem;cursor:pointer;width:26px;height:26px;border-radius:6px}
.cap button:hover{opacity:1}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.capOpen{position:absolute;left:10px;bottom:12px;display:inline-flex;align-items:center;gap:.4rem;height:34px;padding:0 .75rem;border-radius:9px;border:1px solid color-mix(in srgb,var(--s-axis) 18%,transparent);background:color-mix(in srgb,var(--s-bg) 82%,transparent);color:var(--s-axis);font-family:"Source Serif 4",Georgia,serif;font-size:.92rem;cursor:pointer}
.capOpen:hover{border-color:color-mix(in srgb,var(--s-axis) 45%,transparent)}
.capOpen[hidden]{display:none}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid color-mix(in srgb,var(--s-axis) 18%,transparent);background:color-mix(in srgb,var(--s-bg) 82%,transparent);color:var(--s-axis);font-size:1.05rem;cursor:pointer}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(5,10,18,.45)}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + .9rem) 1.1rem calc(env(safe-area-inset-bottom,0px) + 2rem);box-shadow:var(--shadow);overscroll-behavior:contain}
.sh-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.sh-h h2{margin:0;flex:1;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.45rem}
.sheet h4{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;font-weight:600;margin:1.3rem 0 .5rem}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.6rem .8rem;margin-bottom:.6rem}
.term{border-bottom:1px solid var(--line)}
.term summary{list-style:none;cursor:pointer;padding:.75rem .1rem;display:flex;align-items:baseline;gap:.6rem}
.term summary::-webkit-details-marker{display:none}
.term summary span{font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;font-weight:600;flex:1}
.term summary small{color:var(--muted);font-style:italic;font-family:"Source Serif 4",serif}
.term[open] summary span{color:var(--accent)}
.tb{padding:0 .1rem 1rem;font-family:"Source Serif 4",Georgia,serif;font-size:1rem;line-height:1.6;max-width:62ch}
.tb p{margin:0 0 .6rem}
.m{font-style:italic;white-space:nowrap}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:.45rem .8rem}
.colors label{display:flex;align-items:center;gap:.5rem;font-size:.82rem}
.colors input{width:32px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer;flex:none}
@media (max-width:560px){.top{gap:.3rem;padding:.45rem .5rem}.seg button{padding:.3rem .5rem}.btn.ghost{padding:.4rem .45rem}.brand .sub,.btn .lbl{display:none}.brand{font-size:1.05rem}.toggles{grid-template-columns:1fr}.cap{font-size:.85rem;bottom:8px;width:calc(100% - 60px);left:10px;transform:none}.colors{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" data-ih="brand"></div>
    <div class="spacer"></div>
    <div class="seg" id="langSeg"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
    <div class="seg" id="modeSeg" role="tablist"><button data-mode="2d" class="on">2D</button><button data-mode="3d">3D</button></div>
    <button class="btn ghost" id="openGloss" data-it="glossT"><span class="ic">?</span><span class="lbl" data-i="gloss"></span></button>
    <button class="btn ghost hk" id="openKeys" data-it="keys"><span class="ic">⌨</span></button>
    <button class="btn ghost" id="openSet" data-it="settings"><span class="ic">⚙</span><span class="lbl" data-i="settings"></span></button>
  </header>
  <div class="main" id="main">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="ov" id="ov"></div>
      <div class="zoom"><button id="zIn" data-it="zIn">+</button><button id="zOut" data-it="zOut">−</button><button id="zHome" data-it="zHome">⌂</button></div>
      <div class="toast" id="toast"></div>
      <button class="capOpen" id="capOpen" hidden><span aria-hidden="true">💡</span><span data-i="capOpen"></span></button>
      <div class="cap" id="cap"><span id="capT"></span><button id="capX" data-it="capX">×</button></div>
    </div>
    <aside class="side" id="side">
      <div class="grip" id="grip" data-i="grip"></div>
      <section class="panel" data-id="matrix">
        <div class="pb">
          <div class="shapebar"><span class="note" style="margin:0" data-i="shapeL"></span><div class="seg" id="shapeSeg"></div></div>
          <div class="matwrap"><div class="mat" id="matIn"></div></div>
          
          <div class="row"><button class="btn sm" id="bT" data-i="bT"></button><button class="btn sm" id="bInv" data-i="bInv"></button><button class="btn sm" id="bI" data-i="bI"></button></div>
          <details class="more"><summary data-i="cbMore"></summary><p class="note"><span data-ih="matNote"></span><button class="q" data-term="matrix">?</button></p></details>
        </div>
      </section>
      <section class="panel" data-id="presets">
        <div class="pb">
          <div class="chips" id="pre"></div>
          <label class="chk"><input type="checkbox" id="compose"> <span data-i="compose"></span><button class="q" data-term="composition">?</button></label>
          <div class="hist" id="hist"></div>
        </div>
      </section>
      <section class="panel" data-id="anim">
        <div class="pb">
          <div class="row" style="margin-top:.2rem"><button class="btn primary" id="bPlay" data-i="play"></button><button class="btn sm" id="bZero" data-i="zero"></button><button class="btn sm" id="bOne" data-i="one"></button></div>
          <label class="rng"><span data-i="progress"></span><output id="tOut">1</output><input type="range" id="tR" min="0" max="1000" value="1000"></label>
          <label class="rng"><span data-i="speed"></span><output id="spOut"></output><input type="range" id="spR" min="0.25" max="3" step="0.05"></label>
        </div>
      </section>
      <section class="panel" data-id="props">
        <div class="pb"><div class="props" id="props"></div></div>
      </section>
      <section class="panel" data-id="vector">
        <div class="pb">
          <div class="vin" id="vIn"></div>
          <div class="vout" id="vOut"></div>
          <details class="more"><summary data-i="cbMore"></summary>
          <div class="note" id="vEq" style="margin-top:.4rem"></div>
          <div class="d2only">
            <div id="crCtl"><p class="note" style="margin:.7rem 0 .3rem" data-i="crLabel"></p><div style="display:flex;align-items:center;gap:.4rem"><div class="seg" id="slCr"><button data-cr="0" class="on" data-i="crOff"></button><button data-cr="1">x₁</button><button data-cr="2">x₂</button></div><button class="q" data-term="cramer">?</button></div></div>

/* ---------- математика ---------- */
const I=n=>n===2?[1,0,0,1]:[1,0,0,0,1,0,0,0,1];
const lerp=(A,B,t)=>A.map((x,i)=>x+(B[i]-x)*t);
function mul(A,B,n){const R=new Array(n*n).fill(0);for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++)R[i*n+j]+=A[i*n+k]*B[k*n+j];return R}
function ap(M,v,n){if(n===2)return[M[0]*v[0]+M[1]*v[1],M[2]*v[0]+M[3]*v[1]];return[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]]}
function det(M,n){if(n===2)return M[0]*M[3]-M[1]*M[2];const[a,b,c,e,f,g,h,i,j]=M;return a*(f*j-g*i)-b*(e*j-g*h)+c*(e*i-f*h)}
function inv(M,n){const d=det(M,n);if(Math.abs(d)<1e-12)return null;if(n===2)return[M[3]/d,-M[1]/d,-M[2]/d,M[0]/d];const[a,b,c,e,f,g,h,i,j]=M;
  return[(f*j-g*i)/d,(c*i-b*j)/d,(b*g-c*f)/d,(g*h-e*j)/d,(a*j-c*h)/d,(c*e-a*g)/d,(e*i-f*h)/d,(b*h-a*i)/d,(a*f-b*e)/d]}
const tr=(M,n)=>n===2?M[0]+M[3]:M[0]+M[4]+M[8];
function transpose(M,n){const R=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)R[i*n+j]=M[j*n+i];return R}
const col=(M,j,n)=>n===2?[M[j],M[2+j]]:[M[j],M[3+j],M[6+j]];
const norm=v=>Math.hypot(...v);
const nz=v=>{const L=norm(v)||1;return v.map(x=>x/L)};
const isI=(M,n)=>M.every((x,i)=>Math.abs(x-I(n)[i])<1e-9);
const add=(a,b)=>a.map((x,i)=>x+b[i]);
const sc=(a,s)=>a.map(x=>x*s);
function nullspace(A,n,tol){
  const m=[];for(let i=0;i<n;i++)m.push(A.slice(i*n,i*n+n));
  const T=tol*Math.max(1,...A.map(Math.abs));let r=0;const piv=[];
  for(let c=0;c<n&&r<n;c++){
    let b=r;for(let i=r+1;i<n;i++)if(Math.abs(m[i][c])>Math.abs(m[b][c]))b=i;
    if(Math.abs(m[b][c])<T)continue;
    [m[r],m[b]]=[m[b],m[r]];const pv=m[r][c];for(let j=0;j<n;j++)m[r][j]/=pv;
    for(let i=0;i<n;i++)if(i!==r){const f=m[i][c];if(f)for(let j=0;j<n;j++)m[i][j]-=f*m[r][j]}
    piv.push(c);r++;
  }
  const free=[];for(let c=0;c<n;c++)if(!piv.includes(c))free.push(c);
  const basis=free.map(fc=>{const v=new Array(n).fill(0);v[fc]=1;piv.forEach((pc,ri)=>{v[pc]=-m[ri][fc]});return nz(v)});
  return{rank:r,piv,basis};
}
function cubicRoots(A){
  const T=tr(A,3),c2=(A[0]*A[4]-A[1]*A[3])+(A[0]*A[8]-A[2]*A[6])+(A[4]*A[8]-A[5]*A[7]),D=det(A,3);
  const a=-T,b=c2,c=-D,p=b-a*a/3,q=2*a*a*a/27-a*b/3+c,sh=-a/3,disc=(q/2)**2+(p/3)**3;
  const scale=Math.max(1,Math.abs(a),Math.abs(b),Math.abs(c));
  if(Math.abs(p)<1e-12*scale&&Math.abs(q)<1e-12*scale)return[{re:sh,im:0},{re:sh,im:0},{re:sh,im:0}];
  if(disc>1e-12*scale**3){const s=Math.sqrt(disc),u=Math.cbrt(-q/2+s),v=Math.cbrt(-q/2-s);const re=-(u+v)/2+sh,im=(u-v)*Math.sqrt(3)/2;return[{re:u+v+sh,im:0},{re,im},{re,im:-im}]}
  if(disc>=-1e-12*scale**3){const u=Math.cbrt(-q/2);return[{re:2*u+sh,im:0},{re:-u+sh,im:0},{re:-u+sh,im:0}]}
  const r=Math.sqrt(-p/3),phi=Math.acos(Math.max(-1,Math.min(1,-q/(2*r*r*r))));
  return[0,1,2].map(k=>({re:2*r*Math.cos((phi-2*Math.PI*k)/3)+sh,im:0}));
}
function eigen(A,n){
  let roots;
  if(n===2){const T=tr(A,2),D=det(A,2),disc=T*T-4*D;
    if(disc>=-1e-12){const s=Math.sqrt(Math.max(0,disc));roots=[{re:(T+s)/2,im:0},{re:(T-s)/2,im:0}]}
    else{const s=Math.sqrt(-disc);roots=[{re:T/2,im:s/2},{re:T/2,im:-s/2}]}}
  else roots=cubicRoots(A);
  roots.forEach(r=>{if(Math.abs(r.im)<1e-7*(1+Math.abs(r.re)))r.im=0});
  const real=[];roots.filter(r=>r.im===0).forEach(r=>{if(!real.some(x=>Math.abs(x-r.re)<1e-6))real.push(r.re)});
  const vecs=[];
  real.forEach(l=>{const B=A.slice();for(let i=0;i<n;i++)B[i*n+i]-=l;const ns=nullspace(B,n,1e-6);ns.basis.forEach(v=>vecs.push({l,v,dim:ns.basis.length}))});
  return{roots,vecs};
}
function fmt(x,d=2){if(!isFinite(x))return'∞';if(Math.abs(x)<5e-10)x=0;let s=String(+x.toFixed(d));if(s==='-0')s='0';return s.replace('-','−')}

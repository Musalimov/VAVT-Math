<style>
*{box-sizing:border-box}
:root{
  --bg:#eef1f5;--panel:#ffffff;--ink:#16202c;--muted:#5d6876;--line:#d8dee6;--chip:#e6eaf0;--accent:#1f7ea3;--accent-ink:#fff;--shadow:0 14px 40px rgba(20,30,45,.18);
  --side-w:340px;--side-h:44%;
  --s-bg:#0b0c10;--s-bgGrid:#262b33;--s-axis:#f2f2f2;--s-p1:#58c4dd;--s-p2:#ff9f43;--s-eq:#f4d345;--s-area:#83c167;--s-curve:#ff7aa8;--s-mark:#c77dff;--s-bad:#fc6255;--err:#c0392b;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e131b;--panel:#151c27;--ink:#e6ebf2;--muted:#8d99a8;--line:#253041;--chip:#1d2633;--accent:#58c4dd;--accent-ink:#06222c;--shadow:0 14px 40px rgba(0,0,0,.5);--err:#ff8a7a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e131b;--panel:#151c27;--ink:#e6ebf2;--muted:#8d99a8;--line:#253041;--chip:#1d2633;--accent:#58c4dd;--accent-ink:#06222c;--shadow:0 14px 40px rgba(0,0,0,.5);--err:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.9rem;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{min-width:0;flex:0 1 auto;font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand .sub{font-style:italic;font-weight:400;color:var(--muted)}
.spacer{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.82rem;padding:.35rem .75rem;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:.42rem .75rem;cursor:pointer;font-weight:600;font-size:.84rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:.3rem .6rem;font-size:.8rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn .ic{font-family:"Source Serif 4",serif;font-size:1.05rem;line-height:1}
.main{flex:1;min-height:0;display:flex;position:relative}
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--s-bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.side{width:var(--side-w);flex:none;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:.6rem;display:flex;flex-direction:column;gap:.55rem;overscroll-behavior:contain}
.main[data-dock="left"]{flex-direction:row-reverse}
.main[data-dock="left"] .side{border-left:0;border-right:1px solid var(--line)}
.main[data-dock="bottom"]{flex-direction:column}
.main[data-dock="bottom"] .side{width:auto;height:var(--side-h);border-left:0;border-top:1px solid var(--line)}
.main[data-dock="float"] .side{position:absolute;z-index:6;width:min(var(--side-w),calc(100% - 16px));max-height:calc(100% - 16px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.grip{display:none;align-items:center;justify-content:center;gap:.4rem;color:var(--muted);font-size:.78rem;padding:.2rem 0 .1rem;cursor:move;touch-action:none;user-select:none;flex:none}
.grip::before{content:"";width:42px;height:4px;border-radius:2px;background:var(--line)}
.main[data-dock="float"] .grip{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;flex:none}
.panel.dragging{opacity:.45}
.ph{display:flex;align-items:center;gap:.2rem;padding:.35rem .35rem .35rem .25rem}
.handle{cursor:grab;color:var(--muted);padding:.2rem .3rem;user-select:none;font-size:1rem;line-height:1}
.ph h3{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;font-weight:600;flex:1;cursor:pointer;user-select:none}
.icon{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;font-size:.9rem;flex:none}
.icon:hover{background:var(--chip);color:var(--ink)}
.chev{transition:transform .15s}
.pb{padding:.15rem .8rem .8rem}
.panel.collapsed .pb{display:none}
.panel.collapsed .chev{transform:rotate(-90deg)}
.note{color:var(--muted);font-size:.8rem;line-height:1.45;margin:.55rem 0}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:.68rem;font-weight:700;cursor:pointer;vertical-align:middle;padding:0;margin-left:.2rem}
.q:hover{border-color:var(--accent);color:var(--accent)}
.ci{color:var(--s-i)}.cj{color:var(--s-j)}.ck{color:var(--s-k)}
.matwrap{display:flex;justify-content:center;padding-top:.35rem}
.mat{display:inline-grid;gap:.35rem;padding:.4rem .7rem;position:relative}
.mat::before,.mat::after{content:"";position:absolute;top:0;bottom:0;width:9px;border:2px solid var(--ink)}
.mat::before{left:0;border-right:0}
.mat::after{right:0;border-left:0}
.mat input{width:3.9rem;text-align:center;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.92rem;border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;background:var(--bg);padding:.42rem .15rem}
.mat input[data-c="0"]{border-bottom-color:var(--s-i)}
.mat input[data-c="1"]{border-bottom-color:var(--s-j)}
.mat input[data-c="2"]{border-bottom-color:var(--s-k)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.32rem .7rem;font-size:.8rem;font-weight:600;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.chk{display:flex;align-items:center;gap:.45rem;margin-top:.65rem;font-size:.84rem;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.hist{margin-top:.55rem;font-size:.8rem;color:var(--muted);line-height:1.5}
.hist b{color:var(--ink);font-weight:600}
.tex textarea{width:100%;margin-top:.6rem;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:.5rem;resize:vertical;color:var(--ink)}
.tex .row{align-items:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rel{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.8rem;font-family:"Manrope",system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;align-items:center;margin-top:.4rem}
kbd{display:inline-block;min-width:1.6rem;text-align:center;padding:.15rem .45rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--bg);font-family:"Manrope",system-ui,sans-serif;font-size:.8rem;font-weight:700;white-space:nowrap}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:.4rem .8rem;border-radius:9px;background:color-mix(in srgb,var(--s-bg) 88%,transparent);border:1px solid color-mix(in srgb,var(--s-axis) 18%,transparent);color:var(--s-axis);font-size:.85rem;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:560px),(hover:none){.hk{display:none}}
.mulrow{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.55rem}
.ml{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:1.05rem;min-width:3.4rem;text-align:right;white-space:nowrap}
#mulA input,#mulB input{width:3.3rem;font-size:.85rem}
.mulres .mini{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;padding:.15rem .6rem;gap:.15rem .8rem}
.steps summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600;margin-top:.5rem}
.steps div{font-family:"Source Serif 4",Georgia,serif;font-size:.92rem;line-height:1.7;margin-top:.3rem;overflow-x:auto}
.chap h3{display:flex;align-items:baseline;gap:.6rem;margin:1.3rem 0 .1rem;font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;font-weight:600}
.chap h3 .cnt{margin-left:auto;font-family:"Manrope",system-ui,sans-serif;font-size:.75rem;font-weight:600;color:var(--muted)}
.prog{display:flex;align-items:center;gap:.7rem;font-size:.8rem;color:var(--muted);margin:.2rem 0 .3rem}
.prog .bar{flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden;display:block}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
.rd{color:var(--accent);margin-right:.4rem}
.readbtn.on{border-color:var(--accent);color:var(--accent)}
.ill{margin:0 0 .85rem;display:flex;justify-content:center}
.ill svg{width:100%;max-width:300px;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.crm{margin-top:.35rem;font-size:.95rem;line-height:1.7}
.top .seg{flex-wrap:nowrap;flex:none}
@media (max-width:560px){#langSeg{display:none}.cap{font-size:.82rem;padding:.45rem 1.9rem .45rem .7rem}}
.more summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600;margin-top:.6rem}
.kh{position:relative;display:inline-block;line-height:1}
.kh::after{content:"";position:absolute;left:50%;top:-.13em;width:.2em;height:.2em;margin-left:-.1em;border-left:.06em solid currentColor;border-top:.06em solid currentColor;transform:rotate(45deg);pointer-events:none}
.m .kh::after,i .kh::after{margin-left:-.02em}
.gtabs{margin:0 0 .75rem;font-family:"Manrope",system-ui,sans-serif}
.pane[hidden]{display:none}
.mm{vertical-align:middle;margin:.15rem .2rem;font-size:.92em;font-style:normal}
.rng{display:grid;grid-template-columns:1fr auto;gap:.25rem .5rem;margin-top:.7rem;font-size:.82rem;color:var(--muted)}
.rng output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.props{display:grid;gap:.1rem}
.prop{display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;align-items:baseline;padding:.45rem 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop .k{color:var(--muted);font-size:.8rem;white-space:nowrap}
.prop .v{text-align:right;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem}
.prop .s{grid-column:1/-1;font-size:.77rem;color:var(--muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.mini{display:inline-grid;gap:.05rem .6rem;padding:.05rem .5rem;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);border-radius:4px;font-size:.88rem;text-align:right}
.vin{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.vin label{display:flex;align-items:center;gap:.3rem;font-family:"Source Serif 4",serif;font-style:italic}
.vin input{width:4rem;text-align:center;font-family:"JetBrains Mono",ui-monospace,monospace;border:1px solid var(--line);border-bottom:3px solid var(--s-vec);border-radius:8px;background:var(--bg);padding:.38rem .2rem}
.vout{margin-top:.6rem;font-family:"Source Serif 4",serif;font-size:1rem;line-height:1.55}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:.1rem .6rem}
.toggles .chk{margin-top:.35rem;font-size:.8rem}
.d3only{display:none}
body.m3 .d3only{display:revert}
body.m3 .d2only{display:none}
.ov{position:absolute;left:10px;top:10px;padding:.45rem .7rem;border-radius:10px;background:color-mix(in srgb,var(--s-bg) 82%,transparent);border:1px solid color-mix(in srgb,var(--s-axis) 16%,transparent);color:var(--s-axis);font-family:"Source Serif 4",Georgia,serif;pointer-events:none;display:flex;align-items:center;gap:.5rem}
.ov .bm{display:inline-grid;gap:.05rem .7rem;padding:.1rem .45rem;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:5px;font-size:1.02rem;text-align:right;font-variant-numeric:tabular-nums}
.ov .tt{font-size:.85rem;opacity:.75;font-style:italic}
.cap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 90px));padding:.55rem 2rem .55rem .85rem;border-radius:10px;background:color-mix(in srgb,var(--s-bg) 84%,transparent);border:1px solid color-mix(in srgb,var(--s-axis) 16%,transparent);color:var(--s-axis);font-family:"Source Serif 4",Georgia,serif;font-size:.95rem;line-height:1.4}
.cap[hidden]{display:none}
.cap button{position:absolute;right:4px;top:4px;border:0;background:transparent;color:inherit;opacity:.6;font-size:1.1rem;cursor:pointer;width:26px;height:26px;border-radius:6px}
.cap button:hover{opacity:1}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.capOpen{position:absolute;left:10px;bottom:12px;display:inline-flex;align-items:center;gap:.4rem;height:34px;padding:0 .75rem;border-radius:9px;border:1px solid color-mix(in srgb,var(--s-axis) 18%,transparent);background:color-mix(in srgb,var(--s-bg) 82%,transparent);color:var(--s-axis);font-family:"Source Serif 4",Georgia,serif;font-size:.92rem;cursor:pointer}
.capOpen:hover{border-color:color-mix(in srgb,var(--s-axis) 45%,transparent)}
.capOpen[hidden]{display:none}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid color-mix(in srgb,var(--s-axis) 18%,transparent);background:color-mix(in srgb,var(--s-bg) 82%,transparent);color:var(--s-axis);font-size:1.05rem;cursor:pointer}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(5,10,18,.45)}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + .9rem) 1.1rem calc(env(safe-area-inset-bottom,0px) + 2rem);box-shadow:var(--shadow);overscroll-behavior:contain}
.sh-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.sh-h h2{margin:0;flex:1;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.45rem}
.sheet h4{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;font-weight:600;margin:1.3rem 0 .5rem}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.6rem .8rem;margin-bottom:.6rem}
.term{border-bottom:1px solid var(--line)}
.term summary{list-style:none;cursor:pointer;padding:.75rem .1rem;display:flex;align-items:baseline;gap:.6rem}
.term summary::-webkit-details-marker{display:none}
.term summary span{font-family:"Source Serif 4",Georgia,serif;font-size:1.08rem;font-weight:600;flex:1}
.term summary small{color:var(--muted);font-style:italic;font-family:"Source Serif 4",serif}
.term[open] summary span{color:var(--accent)}
.tb{padding:0 .1rem 1rem;font-family:"Source Serif 4",Georgia,serif;font-size:1rem;line-height:1.6;max-width:62ch}
.tb p{margin:0 0 .6rem}
.m{font-style:italic;white-space:nowrap}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:.45rem .8rem}
.colors label{display:flex;align-items:center;gap:.5rem;font-size:.82rem}
.colors input{width:32px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer;flex:none}
@media (max-width:560px){.top{gap:.3rem;padding:.45rem .5rem}.seg button{padding:.3rem .5rem}.btn.ghost{padding:.4rem .45rem}.brand .sub,.btn .lbl{display:none}.brand{font-size:1.05rem}.toggles{grid-template-columns:1fr}.cap{font-size:.85rem;bottom:8px;width:calc(100% - 60px);left:10px;transform:none}.colors{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

.d3only,.d2only{display:revert}
body:not(.mF) .Fonly,body:not(.mI) .Ionly,body:not(.mF):not(.mI) .FIonly,body.mF .Aonly,body.mI .Aonly,body.mI .noI{display:none!important}#modeSeg button{padding:.35rem .6rem}

.lims label{display:flex;align-items:center;gap:.4rem}
.lims input{border-bottom-color:var(--s-lim)}
.ml{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:1.02rem;white-space:nowrap;min-width:0;text-align:left}
.fprev{font-family:"Source Serif 4",Georgia,serif;font-size:1.12rem;text-align:center;margin-top:.7rem;line-height:1.9;overflow-x:auto;padding:.1rem 0}
.err{color:var(--err)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em;background:var(--chip);border-radius:4px;padding:0 .25em}

<script>
(()=>{
'use strict';
/* ---------- выражения от двух переменных x, y ---------- */
function exprXY(src){const s=src.replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s+/g,'').replace(/x1/g,'x').replace(/x2/g,'y').replace(/π/g,'pi');let i=0;
  const pk=()=>s[i],eat=c=>{if(s.startsWith(c,i)){i+=c.length;return true}return false};const F={sin:Math.sin,cos:Math.cos,exp:Math.exp,ln:Math.log,log:Math.log,sqrt:Math.sqrt,abs:Math.abs};
  const cmp=()=>{let a=add();for(;;){if(eat('<=')){const b=add(),A=a;a=(x,y)=>A(x,y)<=b(x,y)+1e-12?1:0}else if(eat('>=')){const b=add(),A=a;a=(x,y)=>A(x,y)>=b(x,y)-1e-12?1:0}else if(eat('<')){const b=add(),A=a;a=(x,y)=>A(x,y)<b(x,y)?1:0}else if(eat('>')){const b=add(),A=a;a=(x,y)=>A(x,y)>b(x,y)?1:0}else return a}};
  const add=()=>{let a=mul();for(;;){if(eat('+')){const b=mul(),A=a;a=(x,y)=>A(x,y)+b(x,y)}else if(pk()==='-'){i++;const b=mul(),A=a;a=(x,y)=>A(x,y)-b(x,y)}else return a}};
  const mul=()=>{let a=un();for(;;){if(eat('*')){const b=un(),A=a;a=(x,y)=>A(x,y)*b(x,y)}else if(eat('/')){const b=un(),A=a;a=(x,y)=>A(x,y)/b(x,y)}else if(i<s.length&&/[0-9a-z(.]/i.test(pk())){const b=un(),A=a;a=(x,y)=>A(x,y)*b(x,y)}else return a}};
  const un=()=>{if(eat('-')){const a=un();return(x,y)=>-a(x,y)}if(eat('+'))return un();return pw()};
  const pw=()=>{const b=at();if(eat('^')){const e=un();return(x,y)=>Math.pow(b(x,y),e(x,y))}return b};
  const at=()=>{if(eat('(')){const e=cmp();if(!eat(')'))throw{msg:'expr'};return e}const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(m){i+=m[0].length;const v=+m[0];return()=>v}
    const w=/^[a-z]+/i.exec(s.slice(i));if(!w)throw{msg:'expr'};const n=w[0].toLowerCase();
    if(n==='x'){i++;return x=>x}if(n==='y'){i++;return(x,y)=>y}if(n==='pi'){i+=2;return()=>Math.PI}if(n==='e'&&!/^[a-z]/i.test(s[i+1]||'')){i++;return()=>Math.E}
    for(const k of['min','max']){if(s.startsWith(k+'(',i)){i+=k.length+1;const a=cmp();if(!eat(';')&&!eat('|'))throw{msg:'expr'};const b=cmp();if(!eat(')'))throw{msg:'expr'};const f=Math[k];return(x,y)=>f(a(x,y),b(x,y))}}
    for(const k in F)if(s.startsWith(k,i)){i+=k.length;const a=at();const f=F[k];return(x,y)=>f(a(x,y))}throw{msg:'expr'}};
  const e=cmp();if(i<s.length)throw{msg:'expr'};return e}
function numG(s){s=String(s).trim().replace(/[−–]/g,'-').replace(',','.');if(/^[-+]?\d*\.?\d+$/.test(s))return parseFloat(s);const m=/^([-+]?\d+)\/(\d+)$/.exec(s);if(m)return(+m[1])/(+m[2]);throw{msg:'num'}}
/* ---------- микроэкономика: математика ---------- */
// линейная связь P и q из строки вида "P = 20 - 2q", "q = 6000 - 50P", "Qd = 100 - 2P", "2P + q = 40"
function linPQ(src){let s=String(src).replace(/[−–]/g,'-').replace(/(\d),(\d)/g,'$1.$2').replace(/\s+/g,'');const eq=s.split('=');if(eq.length!==2||!eq[0]||!eq[1])throw{msg:'lin'};
  const conv=t=>t.replace(/(\d)e(\d)/gi,'$1E$2').replace(/(?<![a-zA-Z])(Q[ds]?|q[ds]?|L|T)(?![a-zA-Z])/g,'y').replace(/(?<![a-zA-Z])[Ppw](?![a-zA-Z])/g,'x').replace(/(\d+(?:\.\d+)?)E(\d+)/g,(m,a,b)=>String(+a*Math.pow(10,+b)));
  let fl,fr;try{fl=exprXY(conv(eq[0]));fr=exprXY(conv(eq[1]))}catch(e){throw{msg:'lin'}}const g=(P,q)=>fl(P,q)-fr(P,q);
  const c=g(0,0),aP=g(1,0)-c,aq=g(0,1)-c;if(![c,aP,aq].every(isFinite))throw{msg:'lin'};
  for(const[P,q]of[[2,3],[-5,7],[11,-4]]){const v=g(P,q),w=c+aP*P+aq*q;if(Math.abs(v-w)>1e-9*Math.max(1,Math.abs(v),Math.abs(w)))throw{msg:'nonlin'}}
  if(Math.abs(aP)<1e-15&&Math.abs(aq)<1e-15)throw{msg:'lin'};if(Math.abs(aP)<1e-15)return{kind:'vert',q0:-c/aq};if(Math.abs(aq)<1e-15)return{kind:'horiz',P0:-c/aP};return{kind:'lin',a:-c/aP,b:-aq/aP}}
const Pof=(L,q)=>L.kind==='lin'?L.a+L.b*q:L.kind==='horiz'?L.P0:NaN;
const qof=(L,P)=>L.kind==='lin'?(P-L.a)/L.b:L.kind==='vert'?L.q0:NaN;
function cross(D,S){// решаем D(q)=S(q)
  if(D.kind==='lin'&&S.kind==='lin'){if(Math.abs(D.b-S.b)<1e-15)return null;const q=(S.a-D.a)/(D.b-S.b);return{q,P:Pof(D,q)}}
  if(D.kind==='vert'&&S.kind==='lin')return{q:D.q0,P:Pof(S,D.q0)};if(S.kind==='vert'&&D.kind==='lin')return{q:S.q0,P:Pof(D,S.q0)};
  if(D.kind==='horiz'&&S.kind==='lin')return{q:qof(S,D.P0),P:D.P0};if(S.kind==='horiz'&&D.kind==='lin')return{q:qof(D,S.P0),P:S.P0};
  if(D.kind==='vert'&&S.kind==='horiz')return{q:D.q0,P:S.P0};if(S.kind==='vert'&&D.kind==='horiz')return{q:S.q0,P:D.P0};return null}
const shiftUp=(L,t)=>L.kind==='lin'?{kind:'lin',a:L.a+t,b:L.b}:L.kind==='horiz'?{kind:'horiz',P0:L.P0+t}:L;
// излишки: точные интегралы кусочно-линейных функций
function intLin(a,b,q0,q1){return a*(q1-q0)+b*(q1*q1-q0*q0)/2}
function CSof(D,q,Pb){if(q<=0)return 0;if(D.kind!=='lin')return D.kind==='horiz'?0:NaN;// ∫0^q (D(s) - Pb) ds, только где D>Pb
  return intLin(D.a-Pb,D.b,0,q)}
function PSof(S,q,Ps){if(q<=0)return 0;if(S.kind==='horiz')return Math.max(0,(Ps-S.P0)*q);if(S.kind==='vert')return Ps*Math.min(q,S.q0);
  // ∫0^q (Ps - max(0,S(s))) ds
  const z=S.b!==0?-S.a/S.b:-1;if(S.a>=0||z<=0)return intLin(Ps-S.a,-S.b,0,q);const qz=Math.min(z,q);return Ps*qz+intLin(Ps-S.a,-S.b,qz,q)}
function market(D,S,o){const E=cross(D,S);if(!E)throw{msg:'nocross'};const R={D,S,E,CS:CSof(D,E.q,E.P),PS:PSof(S,E.q,E.P)};R.W=R.CS+R.PS;
  if(o.kind==='tax'||o.kind==='sub'){const t=o.kind==='tax'?o.v:-o.v;const S2=shiftUp(S,t),E2=cross(D,S2);let q=E2.q,Pb=E2.P,Ps=Pb-t;const gone=!(q>0);if(gone){q=0;Pb=Pof(D,0);Ps=Pb-t}
    Object.assign(R,{gone,q2:q,Pb,Ps,S2,rev:t*q,CS2:CSof(D,q,Pb),PS2:PSof(S,q,Ps)});R.W2=R.CS2+R.PS2+R.rev;R.DWL=R.W-R.W2;R.shareB=(Pb-E.P)/t;R.shareS=(E.P-Ps)/t}
  else if(o.kind==='ceil'||o.kind==='floor'){const P=o.v,qd=Math.max(0,qof(D,P)),qs=Math.max(0,qof(S,P));const bind=o.kind==='ceil'?P<E.P:P>E.P;
    if(!bind)Object.assign(R,{bind:false});else{const q=Math.min(Math.max(0,qd),qs);Object.assign(R,{bind:true,P2:P,qd,qs,q2:q,gap:o.kind==='ceil'?qd-qs:qs-qd,CS2:CSof(D,q,P),PS2:PSof(S,q,P)});R.W2=R.CS2+R.PS2;R.DWL=R.W-R.W2}}
  else if(o.kind==='quota'){const qq=o.v;if(qq>=E.q)Object.assign(R,{bind:false});else{const Pb=Pof(D,qq),Ps=Pof(S,qq);Object.assign(R,{bind:true,q2:qq,Pb,Ps,rent:(Pb-Ps)*qq,CS2:CSof(D,qq,Pb),PS2:PSof(S,qq,Pb)});R.W2=R.CS2+R.PS2;R.DWL=R.W-R.W2}}

const TERMS=[
 T_('demand',['Спрос и закон спроса','D, P = a − bq','<p>Зависимость величины спроса от цены при прочих равных. Закон спроса: чем выше цена, тем меньше покупают. Изменение цены — движение <b>вдоль</b> кривой; изменение дохода, вкусов, цен других товаров — <b>сдвиг</b> кривой.</p>'],['Demand and the law of demand','D, P = a − bq','<p>Quantity demanded as a function of price, other things equal. Law of demand: the higher the price, the less is bought. A price change moves <b>along</b> the curve; income, tastes, other prices <b>shift</b> it.</p>']),
 T_('supply',['Предложение','S','<p>Зависимость величины предложения от цены. Кривая возрастает: при более высокой цене выгодно производить больше. Сдвиги — из-за затрат, технологий, налогов, числа продавцов.</p>'],['Supply','S','<p>Quantity supplied as a function of price. It slopes up: a higher price makes more output worthwhile. Shifts come from costs, technology, taxes, the number of sellers.</p>']),
 T_('equil',['Рыночное равновесие','q*, P*','<p>Цена, при которой величина спроса равна величине предложения. Выше неё — избыток, ниже — дефицит; рынок сам возвращается к равновесию. Задача 4.16: P = 20 − 2q и P = 5 + q дают q* = 5, P* = 10.</p>'],['Market equilibrium','q*, P*','<p>The price at which quantity demanded equals quantity supplied. Above it there is a surplus, below a shortage; the market returns to equilibrium. Problem 4.16: P = 20 − 2q and P = 5 + q give q* = 5, P* = 10.</p>']),
 T_('surplus',['Выигрыш потребителей и производителей','CS, PS','<p><b>CS</b> — площадь между спросом и ценой: сколько покупатели готовы были бы заплатить сверх фактической цены. <b>PS</b> — площадь между ценой и предложением. Их сумма — общественное благосостояние, в равновесии она максимальна.</p>'],['Consumer and producer surplus','CS, PS','<p><b>CS</b> is the area between demand and price: what buyers would pay beyond the actual price. <b>PS</b> is the area between price and supply. Their sum is total welfare, maximal at equilibrium.</p>']),
 T_('tax',['Потоварный налог и его бремя','t, распределение бремени','<p>Налог t с единицы сдвигает предложение вверх на t. Цена покупателя растёт, цена продавца падает; разница — t. Бремя ложится сильнее на менее эластичную сторону независимо от того, кто формально платит. Задача 4.20: q = 1,5, цены 9 и 7, сбор 3.</p>'],['Per-unit tax and incidence','t, incidence','<p>A tax t per unit shifts supply up by t. The buyer price rises, the seller price falls; the gap is t. The less elastic side bears more, whoever formally pays. Problem 4.20: q = 1.5, prices 9 and 7, revenue 3.</p>']),
 T_('dwl',['Мёртвый груз','чистые потери','<p>Потеря благосостояния, которую никто не получает: сделки, выгодные и покупателям, и продавцам, не совершаются. На графике — треугольник между спросом и предложением от нового объёма до равновесного. Возникает при налогах, субсидиях, контроле цен, квотах и монополии.</p>'],['Deadweight loss','net loss','<p>A welfare loss nobody receives: trades beneficial to both sides don’t happen. On the chart it is the triangle between demand and supply from the new quantity to equilibrium. It arises from taxes, subsidies, price controls, quotas and monopoly.</p>']),
 T_('ceiling',['Потолок и пол цены','дефицит и избыток','<p>Потолок ниже равновесия порождает дефицит (q_d > q_s), пол выше равновесия — избыток (q_s > q_d). Продаётся меньшая из двух величин. Задача 4.19: потолок 35 при P = 80 − 5q и P = 32 + q — дефицит 6.</p>'],['Price ceiling and floor','shortage and surplus','<p>A ceiling below equilibrium causes a shortage (q_d > q_s), a floor above it a surplus (q_s > q_d). The smaller quantity is traded. Problem 4.19: a ceiling of 35 with P = 80 − 5q and P = 32 + q — shortage 6.</p>']),
 T_('elast',['Эластичность спроса по цене','E = (dq/dP)·(P/q)','<p>На сколько процентов меняется величина спроса при изменении цены на 1%. |E| > 1 — эластичный спрос, |E| < 1 — неэластичный. На линейном спросе эластичность меняется вдоль прямой: в середине |E| = 1, и там выручка максимальна. Дуговая эластичность считается по средней точке.</p>'],['Price elasticity of demand','E = (dq/dP)·(P/q)','<p>The percentage change in quantity demanded for a 1% change in price. |E| > 1 elastic, |E| < 1 inelastic. On linear demand elasticity varies along the line: |E| = 1 at the midpoint, where revenue peaks. Arc elasticity uses the midpoint formula.</p>']),
 T_('elinc',['Эластичность по доходу и перекрёстная','нормальные, низшие, заменители','<p>По доходу: E < 0 — низшее благо, 0 < E < 1 — благо первой необходимости, E > 1 — роскошь. Перекрёстная: E > 0 — заменители, E < 0 — дополнители.</p>'],['Income and cross elasticity','normal, inferior, substitutes','<p>Income: E < 0 inferior, 0 < E < 1 necessity, E > 1 luxury. Cross: E > 0 substitutes, E < 0 complements.</p>']),
 T_('ic',['Кривые безразличия и MRS','порядковый подход','<p>Кривая безразличия — наборы с одинаковой полезностью. Предельная норма замещения MRS = MUₓ/MUᵧ — сколько Y потребитель готов отдать за единицу X; это наклон кривой. Для заменителей кривые — прямые, для дополнителей — «уголки».</p>'],['Indifference curves and MRS','ordinal approach','<p>An indifference curve holds bundles of equal utility. The marginal rate of substitution MRS = MUₓ/MUᵧ is how much Y the consumer gives up for one X — the slope of the curve. Substitutes give straight lines, complements “L” shapes.</p>']),
 T_('optimum',['Оптимум потребителя','MRS = Pₓ/Pᵧ','<p>Лучший доступный набор — точка касания бюджетной линии Pₓx + Pᵧy = I и самой высокой кривой безразличия: MRS = Pₓ/Pᵧ, или MUₓ/Pₓ = MUᵧ/Pᵧ. Для Кобба–Дугласа U = xᵃyᵇ доля расходов на X постоянна: a/(a + b).</p>'],['Consumer optimum','MRS = Pₓ/Pᵧ','<p>The best affordable bundle is where the budget line Pₓx + Pᵧy = I touches the highest indifference curve: MRS = Pₓ/Pᵧ, or MUₓ/Pₓ = MUᵧ/Pᵧ. With Cobb–Douglas U = xᵃyᵇ the spending share on X is constant: a/(a + b).</p>']),
 T_('slutsky',['Эффекты замещения и дохода','Хикс и Слуцкий','<p>Изменение цены раскладывается на эффект замещения (поворот бюджетной линии при неизменном уровне благосостояния) и эффект дохода (параллельный сдвиг). По Хиксу сохраняется прежняя полезность, по Слуцкому — возможность купить прежний набор. Для нормального блага оба эффекта действуют в одну сторону.</p>'],['Substitution and income effects','Hicks and Slutsky','<p>A price change splits into a substitution effect (rotating the budget line at constant welfare) and an income effect (a parallel shift). Hicks keeps the original utility, Slutsky the ability to buy the original bundle. For a normal good both effects work the same way.</p>']),
 T_('costs',['Затраты в коротком периоде','TC, FC, VC, AC, AVC, MC','<p>TC = FC + VC. Средние: AC = TC/q, AVC = VC/q, AFC = FC/q. Предельные: MC = ΔTC/Δq. Из-за убывающей отдачи MC сначала падает, потом растёт и пересекает AVC и AC в их минимумах.</p>'],['Short-run costs','TC, FC, VC, AC, AVC, MC','<p>TC = FC + VC. Averages: AC = TC/q, AVC = VC/q, AFC = FC/q. Marginal: MC = ΔTC/Δq. Because of diminishing returns MC first falls, then rises and crosses AVC and AC at their minima.</p>']),
 T_('pcomp',['Фирма в условиях совершенной конкуренции','P = MR = MC','<p>Фирма принимает цену, поэтому MR = P. Оптимальный выпуск — где P = MC. Если P < min AVC, фирма закрывается (убыток = FC). Если min AVC ⩽ P < min AC — работает с убытком меньше FC. Кривая предложения фирмы — участок MC выше min AVC. В длительном периоде P = min AC.</p>'],['The perfectly competitive firm','P = MR = MC','<p>The firm takes the price, so MR = P. Optimal output is where P = MC. If P < min AVC the firm shuts down (loss = FC). If min AVC ⩽ P < min AC it operates at a loss below FC. Its supply curve is MC above min AVC. In the long run P = min AC.</p>']),
 T_('monop',['Монополия','MR = MC','<p>Монополист сам выбирает цену на кривой спроса. MR = P + q·dP/dq < P; для линейного спроса MR вдвое круче. Оптимум — MR = MC, цена берётся со спроса. По сравнению с конкуренцией выпуск меньше, цена выше, возникает мёртвый груз. Задача 11.8: q = 20, P = 160, прибыль 400.</p>'],['Monopoly','MR = MC','<p>The monopolist picks the price on the demand curve. MR = P + q·dP/dq < P; for linear demand MR is twice as steep. The optimum is MR = MC with the price from demand. Compared with competition output is lower, the price higher, and a deadweight loss appears. Problem 11.8: q = 20, P = 160, profit 400.</p>']),
 T_('lerner',['Индекс Лернера','L = (P − MC)/P','<p>Мера рыночной власти: от 0 (конкуренция) до 1. В оптимуме монополиста L = 1/|E| — чем менее эластичен спрос, тем больше наценка. Монополист никогда не работает на неэластичном участке спроса.</p>'],['Lerner index','L = (P − MC)/P','<p>A measure of market power from 0 (competition) to 1. At the monopoly optimum L = 1/|E|: the less elastic demand, the bigger the markup. A monopolist never operates on the inelastic part of demand.</p>']),
 T_('discr',['Ценовая дискриминация','1-й, 2-й, 3-й степени','<p>3-я степень: разные цены для групп покупателей, MR₁ = MR₂ = MC; выше цена там, где спрос менее эластичен. 1-я степень (совершенная): каждый платит свою максимальную цену, мёртвого груза нет, весь выигрыш у продавца. 2-я степень — цена зависит от объёма покупки.</p>'],['Price discrimination','first, second, third degree','<p>Third degree: different prices for groups, MR₁ = MR₂ = MC; the price is higher where demand is less elastic. First degree (perfect): everyone pays their maximum, no deadweight loss, the seller takes all surplus. Second degree: the price depends on the amount bought.</p>'])];

 T_('ppf',['Кривая производственных возможностей','КПВ, альтернативные затраты','<p>Наборы двух благ, которые можно произвести при полном и эффективном использовании ресурсов. Точки внутри — неэффективность, вне — недостижимо. Наклон — альтернативные затраты: сколько одного блага приходится отдать ради единицы другого. Обычно они возрастают, и КПВ выпукла наружу.</p>'],['Production possibilities frontier','PPF, opportunity cost','<p>Bundles of two goods producible with full and efficient use of resources. Points inside are inefficient, outside unattainable. The slope is opportunity cost; it usually rises, so the PPF bows outward.</p>']),
 T_('prodf',['Производственная функция','TP, AP, MP, изокванта','<p>q = f(L, K). В коротком периоде K фиксирован: TP, AP = TP/L, MP = dTP/dL; MP пересекает AP в его максимуме. В длительном — изокванты (одинаковый выпуск) и изокосты wL + rK = C; оптимум при MRTS = MPL/MPK = w/r. Для q = AL^αK^β отдача от масштаба зависит от α + β.</p>'],['Production function','TP, AP, MP, isoquant','<p>q = f(L, K). In the short run K is fixed: TP, AP = TP/L, MP = dTP/dL; MP crosses AP at its maximum. In the long run, isoquants and isocosts wL + rK = C; the optimum has MRTS = MPL/MPK = w/r. For q = AL^αK^β returns to scale depend on α + β.</p>']),
 T_('mcomp',['Монополистическая конкуренция','избыточная мощность','<p>Много фирм с дифференцированным продуктом и свободный вход. В коротком периоде фирма как монополист: MR = MC. В длительном вход сводит прибыль к нулю: спрос касается LAC, P = LAC, но выпуск меньше минимума LAC — избыточная мощность. Задача 12.3: 0,9.</p>'],['Monopolistic competition','excess capacity','<p>Many firms with differentiated products and free entry. Short run: like a monopolist, MR = MC. Long run: entry drives profit to zero — demand is tangent to LAC, P = LAC, yet output is below minimum LAC: excess capacity. Problem 12.3: 0.9.</p>']),
 T_('oligo',['Олигополия','Курно, Штакельберг, картель, HHI','<p>Несколько крупных фирм учитывают реакцию друг друга. Курно — одновременный выбор объёмов, равновесие на пересечении функций реакции. Штакельберг — лидер ходит первым. Картель максимизирует общую прибыль, но неустойчив: каждой фирме выгодно нарушить квоту. Концентрацию измеряют индексом HHI = Σ доля².</p>'],['Oligopoly','Cournot, Stackelberg, cartel, HHI','<p>A few large firms take each other’s reactions into account. Cournot: simultaneous quantities, equilibrium where reaction functions cross. Stackelberg: the leader moves first. A cartel maximizes joint profit but is unstable: each firm gains by breaking its quota. Concentration is measured by HHI = Σ share².</p>']),
 T_('labor',['Рынок труда и монопсония','MRP, MRC, рента','<p>Фирма нанимает, пока MRP = p·MP_L = w. Экономическая рента работников — площадь между зарплатой и кривой предложения труда. Монопсонист (единственный покупатель труда) приравнивает MRP к MRC, который круче предложения: нанимает меньше и платит меньше MRP. Минимальная зарплата в определённом диапазоне может увеличить занятость.</p>'],['Labor market and monopsony','MRP, MRC, rent','<p>A firm hires until MRP = p·MP_L = w. Workers’ economic rent is the area between the wage and labor supply. A monopsonist sets MRP = MRC, which is steeper than supply: it hires fewer and pays below MRP. A minimum wage in some range can raise employment.</p>']),
 T_('pv',['Дисконтирование','PV, FV, аннуитет, NPV','<p>FV = PV(1 + i)ⁿ; PV = FV/(1 + i)ⁿ. Аннуитет: PV = PMT(1 − (1 + i)⁻ⁿ)/i, FV = PMT((1 + i)ⁿ − 1)/i; бессрочный поток PV = PMT/i. Проект выгоден, если NPV = Σ CFₜ/(1 + i)ᵗ ⩾ 0; IRR — ставка, при которой NPV = 0. Цена земли — капитализированная рента R/i.</p>'],['Discounting','PV, FV, annuity, NPV','<p>FV = PV(1 + i)ⁿ; PV = FV/(1 + i)ⁿ. Annuity: PV = PMT(1 − (1 + i)⁻ⁿ)/i, FV = PMT((1 + i)ⁿ − 1)/i; a perpetuity PV = PMT/i. A project pays if NPV = Σ CFₜ/(1 + i)ᵗ ⩾ 0; IRR is the rate where NPV = 0. Land price is capitalized rent R/i.</p>']),
 T_('extern',['Внешние эффекты и налог Пигу','PMC, SMC','<p>Отрицательный внешний эффект — издержки третьих лиц, не учтённые в цене: SMC = PMC + MEC. Рынок производит больше оптимума, возникает мёртвый груз. Налог Пигу, равный внешним издержкам на единицу, интернализирует эффект. Задача 16.2: выпуск 4 вместо 3, потери 1,5.</p>'],['Externalities and the Pigouvian tax','PMC, SMC','<p>A negative externality is a cost to third parties not reflected in the price: SMC = PMC + MEC. The market overproduces, creating a deadweight loss. A Pigouvian tax equal to the external cost per unit internalizes it. Problem 16.2: output 4 instead of 3, loss 1.5.</p>']),
 T_('pubg',['Общественные блага','неисключаемость, неконкурентность','<p>Благо, потребление которого одним не уменьшает его для других и от которого нельзя исключить. Общая готовность платить — <b>вертикальная</b> сумма индивидуальных спросов; оптимум ΣMB = MC. Из-за безбилетников рынок производит его недостаточно. Задача 16.8: 5 дворников.</p>'],['Public goods','non-excludable, non-rival','<p>A good whose use by one doesn’t reduce it for others and from which no one can be excluded. Total willingness to pay is the <b>vertical</b> sum of individual demands; the optimum is ΣMB = MC. Free riders make the market underprovide it. Problem 16.8: 5 street cleaners.</p>']));

const E=(msg)=>{throw{msg}};const nI=s=>{const v=numG(String(s==null?'':s).replace(',','.'));return v};

  const shD=I.shD===''||I.shD==null?0:nI(I.shD),shS=I.shS===''||I.shS==null?0:nI(I.shS);const D0=D,S0=Sp;D=shiftUp(D,shD);Sp=shiftUp(Sp,shS);
  const o=I.iv==='none'?{}:{kind:I.iv,v:nI(I.v)};if(o.kind&&!(o.v>0))E('pos');const R=market(D,Sp,o);if(!(R.E.q>0))E('nocross');R.iv=I.iv;R.v=o.v;if(shD||shS){R.D0=D0;R.S0=S0;R.E0=cross(D0,S0);R.shD=shD;R.shS=shS}return R}

  let D;try{D=linPQ(I.D)}catch(e){E('lin')}if(D.kind!=='lin'||D.b>=0)E('dslope');const a=D.a,b=D.b,qmax=-a/b;const R={em:I.em,D,a,b,qmax,Pmid:a/2,qmid:qmax/2,TRmax:a*qmax/4};
  if(I.em==='pt'){const P=nI(I.P1);if(!(P>0&&P<a))E('prange');Object.assign(R,{P,...elastAt(D,P)})}
  else if(I.em==='arc'){const p1=nI(I.P1),p2=nI(I.P2);if(!(p1>0&&p1<a&&p2>0&&p2<a&&p1!==p2))E('prange');const q1=qof(D,p1),q2=qof(D,p2);Object.assign(R,{p1,p2,q1,q2,Earc:arcE(q1,q2,p1,p2),E1:elastAt(D,p1).E,E2:elastAt(D,p2).E,TR1:p1*q1,TR2:p2*q2})}
  else{const Ev=Math.abs(nI(I.Ev));if(!(Ev>0))E('pos');const P=a*Ev/(1+Ev);Object.assign(R,{Ev,P,q:qof(D,P),E:-Ev})}return R}
function compCons(I){const t=I.ut,al=nI(I.al),be=nI(I.be),I0=nI(I.I),dI=I.dI===''||I.dI==null?0:nI(I.dI),Iv=I0+dI,px=nI(I.px),py=nI(I.py);if(![al,be,Iv,px,py].every(v=>v>0))E('pos');const R={t,al,be,I:Iv,px,py,A:consumer(t,al,be,Iv,px,py)};
  const p2=I.px2===''||I.px2==null?null:nI(I.px2);if(p2!==null){if(!(p2>0))E('pos');if(Math.abs(p2-px)>1e-12)Object.assign(R,{px2:p2,...slutsky(t,al,be,Iv,px,py,p2)})}
  R.MRS=t==='cd'?al*R.A.y/(be*R.A.x):t==='sub'?al/be:NaN;if(dI){R.I0=I0;R.A0=consumer(t,al,be,I0,px,py)}return R}
function compCost(I){const FC=nI(I.FC),qmax=nI(I.qmax);if(!(FC>=0&&qmax>0))E('pos');const C=costs(FC,vcOf(I.VC));if(!isFinite(C.VC(qmax/2)))E('vc');

function compComp(I){const P=nI(I.P),FC=nI(I.FC),qmax=nI(I.qmax);if(!(P>0&&FC>=0&&qmax>0))E('pos');const C=costs(FC,vcOf(I.VC));const r=competitive(P,C,qmax);
  const be=roots1(q=>P*q-C.TC(q),1e-9,qmax);return{P,FC,qmax,C,...r,beQ:be,AC:r.q>0?C.AC(r.q):NaN,TR:P*r.q,TC:C.TC(r.q)}}
function compMono(I){let D;try{D=linPQ(I.D)}catch(e){E('lin')}if(D.kind!=='lin'||D.b>=0)E('dslope');
  if(I.dm==='disc'){let D2;try{D2=linPQ(I.D2)}catch(e){E('lin')}if(D2.kind!=='lin'||D2.b>=0)E('dslope');const c=nI(I.c);if(!(c>=0))E('pos');const r=discrim3(D,D2,c);

function solveSD(R){const L=T(),st=[];if(R.E0)st.push(L.m_shift(fp(R.shD||0),fp(R.shS||0),fp(R.E0.q),fp(R.E0.P)));st.push(L.m_lines(lineT(R.D),lineT(R.S)));st.push(L.m_eq(fp(R.E.q),fp(R.E.P)));

function dragDist(d,px,py){const fr=d.fr,r=fr.r;if(px<r.x-6||px>r.x+r.w+6||py<r.y-6||py>r.y+r.h+6)return Infinity;let best=Infinity;
  if(d.kind==='hl')return Math.abs(fr.Y(d.fn)-py);if(d.kind==='vl')return Math.abs(fr.X(d.fn)-px);
  for(let i=0;i<=160;i++){if(d.kind==='fy'){const x=invX(fr,r.x+r.w*i/160),y=d.fn(x);if(!isFinite(y))continue;best=Math.min(best,Math.hypot(fr.X(x)-px,fr.Y(y)-py))}else{const y=invY(fr,r.y+r.h*i/160),x=d.fn(y);if(!isFinite(x))continue;best=Math.min(best,Math.hypot(fr.X(x)-px,fr.Y(y)-py))}}return best}
function pickDrag(px,py){let b=null,bd=12;for(const d of DRAGS){const v=dragDist(d,px,py);if(v<bd){bd=v;b=d}}return b}
const cvPos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const niceRound=v=>{if(!isFinite(v))return 0;const a=Math.abs(v);const d=a>=1000?0:a>=100?1:a>=10?2:a>=1?3:4;return+v.toFixed(d)};
cv.addEventListener('pointerdown',e=>{const p=cvPos(e),d=pickDrag(p.x,p.y);if(!d)return;const I=S.inp[S.topic];const raw=I[d.field];const pv=x=>{const t=String(x).trim();return t.endsWith('%')?nI(t.slice(0,-1))/100:nI(t)};let v0;try{v0=raw===''||raw==null?(d.base?d.base():0):pv(raw)}catch(err){v0=d.base?d.base():0}dragNow={d,px:p.x,py:p.y,v0};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';e.preventDefault()});
cv.addEventListener('pointermove',e=>{const p=cvPos(e);if(!dragNow){cv.style.cursor=pickDrag(p.x,p.y)?'grab':'default';return}const{d,px,py,v0}=dragNow,fr=d.fr;
  const delta=(d.kind==='fy'||d.kind==='hl')?invY(fr,p.y)-invY(fr,py):invX(fr,p.x)-invX(fr,px);let v=niceRound(v0+delta*d.scale);if(d.clamp)v=d.clamp(v);
  S.inp[S.topic][d.field]=v===0&&!d.base?'':dc(String(v));S.shock=null;S.preset=null;const el=document.querySelector(`#form [data-k="${d.field}"]`);if(el)el.value=S.inp[S.topic][d.field];
  if(!dragRaf)dragRaf=requestAnimationFrame(()=>{dragRaf=0;recompute()})});
const endDrag=()=>{if(dragNow){dragNow=null;cv.style.cursor='default'}};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
/* ---------- факторы и сдвиги ---------- */
const arrowOf=(a,b)=>{const t=1e-7*Math.max(1,Math.abs(a),Math.abs(b));return b>a+t?'<b class="up">↑</b>':b<a-t?'<b class="dn">↓</b>':'<span class="z">—</span>'};
function cleared(t){const I={...S.inp[t]};(DELTAS[t]||[]).forEach(k=>{I[k]=''});return I}
function renderFactors(){const box=$('#fac');if(!box)return;const t=S.topic,L=T(),list=SHOCKS[t];if(!list){box.innerHTML=`<p class="note">${L.fac_none}</p>`;return}
  let base;try{base=COMP[t](cleared(t))}catch(e){box.innerHTML=`<p class="note">${L.cap.err}</p>`;return}const ev=EFFV[t],b0=ev(base,true),vars=Object.keys(b0);if(!vars.length){box.innerHTML=`<p class="note">${L.fac_mode||L.fac_none}</p>`;return}
  const rows=list.map(sh=>{let r;try{r=COMP[t]({...cleared(t),...sh.set(cleared(t))})}catch(e){return null}const b1=ev(r,false);return{sh,b1}}).filter(Boolean);
  box.innerHTML=`<p class="note" style="margin:.1rem 0 .5rem">${L.fac_note}</p><div class="tw"><table class="tab fac"><tr><th style="text-align:left">${L.fac_f}</th><th style="text-align:left">${L.fac_c}</th>${vars.map(v=>`<th>${v}</th>`).join('')}</tr>${rows.map(({sh,b1})=>`<tr data-shock="${sh.id}" class="${S.shock===sh.id?'on':''}"><td style="text-align:left">${sh[P.lang]||sh.ru}</td><td style="text-align:left">${(P.lang==='en'?sh.cen:sh.c)||''}</td>${vars.map(v=>`<td>${arrowOf(b0[v],b1[v])}</td>`).join('')}</tr>`).join('')}</table></div>`+(S.shock?`<div class="row"><button class="btn sm" id="facReset">${L.fac_reset}</button></div>`:'')}
document.addEventListener('click',e=>{const tr=e.target.closest('tr[data-shock]');if(tr){const sh=SHOCKS[S.topic].find(s=>s.id===tr.dataset.shock);if(!sh)return;S.inp[S.topic]={...cleared(S.topic),...sh.set(cleared(S.topic))};S.shock=sh.id;S.preset=null;renderForm();recompute();return}
  if(e.target.id==='facReset'){S.inp[S.topic]=cleared(S.topic);S.shock=null;renderForm();recompute()}});
/* ---------- справочник ---------- */
const termTitle=id=>{const t=TERMS.find(x=>x.id===id);return t?(t[P.lang]||t.ru)[0]:id};
function mathify(h){return h}
function gTabs(id,html){const f=FORMAL[id];if(!f)return html;const L=T(),ft=P.gTab==='f';
  return`<div class="seg gtabs"><button data-tab="i" class="${ft?'':'on'}">${L.tabI}</button><button data-tab="f" class="${ft?'on':''}">${L.tabF}</button></div><div class="pane" data-pane="i"${ft?' hidden':''}>${html}</div><div class="pane" data-pane="f"${ft?'':' hidden'}>${f[P.lang]||f.ru}</div>`}
function termHtml(t,L){const x=t[P.lang]||t.ru,rd=!!P.read[t.id];
  return`<details class="term${rd?' read':''}" id="g-${t.id}"><summary><span>${rd?'<b class="rd">✓</b>':''}${x[0]}</span><small>${x[1]}</small></summary><div class="tb">${ILL[t.id]?`<figure class="ill">${illSvg(t.id)}</figure>`:''}${gTabs(t.id,x[2])}${DEMOS[t.id]?`<button class="btn sm primary" data-demo="${t.id}">${L.showDemo}</button>`:''}${REL[t.id]?`<div class="rel">${L.seeAlso} ${REL[t.id].map(r=>`<button class="chip" data-term="${r}">${termTitle(r)}</button>`).join('')}</div>`:''}<div class="row" style="margin-top:.8rem"><button class="btn sm readbtn${rd?' on':''}" data-read="${t.id}">${rd?L.readDone:L.readMark}</button></div></div></details>`}
function renderGloss(q=''){q=q.trim().toLowerCase();const L=T();if(!P.read||typeof P.read!=='object')P.read={};
  const total=TERMS.length,done=TERMS.filter(t=>P.read[t.id]).length;
  const match=t=>{if(!q)return true;const x=t[P.lang]||t.ru,o=t[P.lang==='ru'?'en':'ru'],f=FORMAL[t.id];return(x[0]+' '+x[1]+' '+x[2]+' '+o[0]+' '+(f?(f[P.lang]||f.ru):'')).replace(/<[^>]+>/g,'').toLowerCase().includes(q)};
  let html=`<div class="prog"><span>${L.readOf(done,total)}</span><span class="bar"><i style="width:${Math.round(done/total*100)}%"></i></span>${done?`<button class="linkbtn" id="readReset">${L.readReset}</button>`:''}</div>`;
  let any=false,num=0;
  CHAP.forEach(ch=>{if(!ch.extra)num++;const ts=ch.ids.map(id=>TERMS.find(t=>t.id===id)).filter(Boolean).filter(match);if(!ts.length)return;any=true;
    const r=ch.ids.filter(id=>P.read[id]).length;
    html+=`<section class="chap"><h3>${ch.extra?'':num+'. '}${ch[P.lang]||ch.ru}<span class="cnt">${r} / ${ch.ids.length}</span></h3>${ts.map(t=>termHtml(t,L)).join('')}</section>`});
  $('#gl').innerHTML=any?html:html+`<p class="note">${L.noFound}</p>`}
function rerenderGloss(){const sh=$('#dGloss .sheet'),st=sh.scrollTop,open=[...document.querySelectorAll('#gl details[open]')].map(d=>d.id);renderGloss($('#gq').value);open.forEach(id=>{const e=document.getElementById(id);if(e)e.open=true});sh.scrollTop=st}
$('#gq').oninput=e=>renderGloss(e.target.value);
$('#gl').addEventListener('click',e=>{const rb=e.target.closest('[data-read]');if(rb){P.read[rb.dataset.read]=!P.read[rb.dataset.read];if(!P.read[rb.dataset.read])delete P.read[rb.dataset.read];save();rerenderGloss();return}
  if(e.target.closest('#readReset')){P.read={};save();rerenderGloss()}});
$('#gl').addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(!tb)return;const box=tb.closest('.tb');P.gTab=tb.dataset.tab;
  box.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===P.gTab));box.querySelectorAll('.pane').forEach(p=>{p.hidden=p.dataset.pane!==P.gTab});save()});
$('#gl').addEventListener('click',e=>{const b=e.target.closest('[data-demo]');if(!b)return;closeDrawers();runDemo(b.dataset.demo)});

function openDrawer(id){document.getElementById(id).classList.add('open')}
function closeDrawers(){document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('open'))}
document.querySelectorAll('[data-close]').forEach(el=>el.onclick=closeDrawers);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawers()});
$('#openGloss').onclick=()=>{$('#gq').value='';renderGloss();openDrawer('dGloss')};
function openTerm(id){if(!TERMS.find(t=>t.id===id))return;$('#gq').value='';renderGloss();openDrawer('dGloss');const el=document.getElementById('g-'+id);if(el){el.open=true;setTimeout(()=>el.scrollIntoView({block:'start'}),30)}}

/* ---------- экспорт ---------- */
let DL=null,fmtMode='tex';
const LOCAL=!window.claude;
const canSave=()=>!!(DL||LOCAL);
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')DL=await window.claude.use('downloads')}catch(e){DL=null}S.dlTried=true;updExport()})();
function vidMime(){if(!window.MediaRecorder||!cv.captureStream)return null;for(const m of['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'])if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;return null}
function updExport(){const L=T();$('#xPng').disabled=!canSave()||S.rec;$('#xVid').disabled=!canSave()||!vidMime()||S.rec;$('#xNote').textContent=S.rec?L.xRec:!canSave()?(S.dlTried?L.xNoDl:''):(!vidMime()?L.xNoVid:'')}
function flash(msg,ms=3500){$('#xNote').textContent=msg;clearTimeout(flash.t);if(ms)flash.t=setTimeout(updExport,ms)}
async function saveFile(name,data){const L=T();if(!DL){if(LOCAL){const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);flash(L.xSaved)}return}
  try{await DL.save({filename:name,data});flash(L.xSaved)}catch(e){const c=e&&e.code;if(c==='declined'){updExport();return}if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){DL=null;S.dlTried=true;updExport();return}flash(c==='rate_limited'?L.xBusy:L.xFail)}}
function exportPng(){if(!canSave()||S.rec)return;S.stamp=$('#xStamp').checked;renderNow();cv.toBlob(b=>{S.stamp=false;req();if(b)saveFile('microeconomics.png',b)},'image/png')}
async function exportVideo(){const m=vidMime();if(!canSave()||!m||S.rec||S.err||!S.anyAnim)return;S.rec=true;S.stamp=$('#xStamp').checked;updExport();
  const keep=ms=>new Promise(r=>{const t0=performance.now();const f=()=>{renderNow();if(performance.now()-t0<ms)requestAnimationFrame(f);else r()};f()});
  const chunks=[];let rec;
  try{const stream=cv.captureStream(60);rec=new MediaRecorder(stream,{mimeType:m,videoBitsPerSecond:8e6});rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const stopped=new Promise(r=>{rec.onstop=r});S.t=0;S.anim=null;rec.start(100);await keep(500);
    play();await new Promise(r=>{const f=()=>S.anim?requestAnimationFrame(f):r();f()});await keep(900);rec.stop();await stopped}
  catch(err){S.rec=false;S.stamp=false;req();flash(T().xFail);return}
  S.rec=false;S.stamp=false;req();updExport();const blob=new Blob(chunks,{type:m});if(blob.size)saveFile(`probability.${m.startsWith('video/mp4')?'mp4':'webm'}`,blob);else flash(T().xFail)}
async function copyTex(){const ta=$('#xTex'),L=T();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){}if(!ok){ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e){}}flash(ok?L.xCopied:L.xSelect)}
$('#xPng').onclick=exportPng;$('#xVid').onclick=exportVideo;$('#xCopy').onclick=copyTex;
document.querySelectorAll('#xFmt button').forEach(b=>b.onclick=()=>{fmtMode=b.dataset.f;document.querySelectorAll('#xFmt button').forEach(x=>x.classList.toggle('on',x===b));renderTex()});

function illSvg(){return''}
function runDemo(id){const d=DEMOS[id];if(!d)return;loadPreset(d.p);showPanel('solve')}
function renderTex(){const ta=$('#xTex');if(!ta)return;if(S.err||!S.res){ta.value='';return}const a=(S.ans||'').replace(/<[^>]+>/g,'');
  if(fmtMode==='txt'){ta.value=`${T()['t_'+S.topic]}\n${a}`;return}if(fmtMode==='tex'){ta.value=a.replace(/≈/g,'\\approx ').replace(/·/g,'\\cdot ');return}
  const R=S.res,t=S.topic;let py='';const ln=L=>L.kind==='lin'?`${L.a} + (${L.b})*q`:'?';
  if(t==='sd')py=`from sympy import symbols, solve\nq = symbols('q')\nD = ${ln(R.D)}\nS = ${ln(R.S)}\nqs = solve(D - S, q)[0]\nprint(qs, D.subs(q, qs))`;
  else if(t==='mono'&&R.dm==='one')py=`from sympy import symbols, diff, solve\nq = symbols('q')\nP = ${ln(R.D)}\nTC = ${R.FC} + (${S.inp.mono.VC.replace(/\^/g,'**').replace(/(\d)q/g,'$1*q')})\nqm = [r for r in solve(diff(P*q - TC, q), q) if r > 0]\nprint(qm, [P.subs(q, r) for r in qm])`;
  else py=`# ${T()['t_'+t]}\nprint(${JSON.stringify(a)})`;ta.value=py}
const KEYS=[['1 – 9','k_topic'],['[ / ]','k_prev'],['G','k_grid'],['H','k_hint'],['S','k_png'],['/','k_gloss'],['?','k_keys'],['Esc','k_esc']];
function renderKeys(){const L=T();$('#keysList').innerHTML=KEYS.map(([k,d])=>`<span>${k.split(' ').map((p,i)=>i>0&&/^[+\/–]$/.test(p)?p:`<kbd>${p}</kbd>`).join(' ')}</span><span>${L[d]}</span>`).join('')}
function openKeys(){renderKeys();closeDrawers();openDrawer('dKeys')}
$('#openKeys').onclick=openKeys;$('#openKeys2').onclick=openKeys;
function toast(msg,ms=1600){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms)}
function flip(k){P.show[k]=!P.show[k];syncToggles();save();renderCaption();req();const L=T();toast(`${L.tog[k]}: ${P.show[k]?L.on:L.off}`)}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target,tag=tg&&tg.tagName;if((tag==='INPUT'&&!['checkbox','range','radio','color'].includes(tg.type))||tag==='TEXTAREA'||tag==='SELECT'||(tg&&tg.isContentEditable))return;
  const isQ=e.key==='?'||(e.code==='Slash'&&e.shiftKey);if(document.querySelector('.drawer.open')&&!isQ)return;const c=e.code,L=T();let h=true;
  if(isQ)openKeys();else if(/^(Digit|Numpad)[1-9]$/.test(c)){setTopic(TOPICS[+c.slice(-1)-1]);toast(L['t_'+S.topic])}
  else if(c==='BracketLeft'||c==='BracketRight'){const list=PRE[S.topic];let i=list.findIndex(p=>p[0]===S.preset);i=(i+(c==='BracketLeft'?-1:1)+list.length)%list.length;loadPreset(list[i][0]);toast(P.lang==='ru'?list[i][2]:list[i][3])}
  else if(c==='KeyG')flip('bgGrid');else if(c==='KeyH')flip('hints');else if(c==='KeyS'){if(canSave())exportPng();else toast(L.xNoDl)}else if(c==='Slash'){$('#openGloss').click();setTimeout(()=>$('#gq').focus(),30)}else h=false;if(h)e.preventDefault()});
/* ---------- настройки ---------- */
$('#openSet').onclick=()=>{syncSettings();openDrawer('dSet')};
function buildSettings(){
  document.querySelectorAll('#langSeg button,#langSeg2 button').forEach(b=>b.onclick=()=>{P.lang=b.dataset.l;applyLang();save()});
  document.querySelectorAll('#uiSeg button').forEach(b=>b.onclick=()=>{P.ui=b.dataset.v;applyPrefs()});
  document.querySelectorAll('#dockSeg button').forEach(b=>b.onclick=()=>{P.dock=b.dataset.v;applyPrefs()});
  $('#wR').oninput=e=>{P.width=+e.target.value;applyPrefs()};
  $('#hR').oninput=e=>{P.bottomH=+e.target.value;applyPrefs()};
  $('#fR').oninput=e=>{P.font=+e.target.value;applyPrefs()};
  $('#lR').oninput=e=>{P.lw=+e.target.value;applyPrefs()};
  $('#resetOrder').onclick=()=>{P.order=PANELS.slice();P.collapsed={};applyPrefs()};
  $('#resetAll').onclick=()=>{const lg=P.lang,rd=P.read,last=P.last;P=clone(DEF);P.lang=lg;P.read=rd||{};P.last=last;syncToggles();applyPrefs();renderAll()};
}
function buildPal(){const L=T();
  const pc=$('#palChips');pc.innerHTML='';Object.entries(PAL).forEach(([k,p])=>{const b=document.createElement('button');b.className='chip';b.dataset.p=k;b.innerHTML=`<span class="sw" style="background:${p.bg};box-shadow:inset 0 0 0 3px ${p.f}"></span>${L.pal[k]}`;
    b.onclick=()=>{P.palette=k;P.colors={...PAL[k]};applyPrefs()};pc.appendChild(b)});
  const cs=$('#colors');cs.innerHTML='';Object.keys(L.colors).forEach(k=>{const l=document.createElement('label');l.innerHTML=`<input type="color" data-k="${k}"> ${L.colors[k]}`;
    l.querySelector('input').oninput=e=>{P.colors[k]=e.target.value;P.palette='custom';applyPrefs()};cs.appendChild(l)});
}
function applyLang(){const L=T();LNG=P.lang;document.documentElement.lang=P.lang;document.title=L.title;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=L[e.dataset.i]});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=L[e.dataset.ih]});
  document.querySelectorAll('[data-it]').forEach(e=>{e.title=L[e.dataset.it];e.setAttribute('aria-label',L[e.dataset.it])});
  document.querySelectorAll('[data-ia]').forEach(e=>{e.setAttribute('aria-label',L[e.dataset.ia])});
  $('#gq').placeholder=L.search;cv.setAttribute('aria-label',L.canvas);
  document.querySelectorAll('#langSeg button,#langSeg2 button').forEach(b=>b.classList.toggle('on',b.dataset.l===P.lang));
  buildPal();buildToggles();syncToggles();syncSettings();updExport();renderKeys();
  if($('#dGloss').classList.contains('open'))rerenderGloss();
  renderForm();recompute()}
function syncSettings(){
  document.querySelectorAll('#uiSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===P.ui));
  document.querySelectorAll('#dockSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===P.dock));
  document.querySelectorAll('#palChips .chip').forEach(b=>b.classList.toggle('on',b.dataset.p===P.palette));
  document.querySelectorAll('#colors input').forEach(i=>{i.value=P.colors[i.dataset.k]});
  $('#wR').value=P.width;$('#wOut').textContent=P.width+' px';$('#hR').value=P.bottomH;$('#hOut').textContent=P.bottomH+' %';
  $('#fR').value=P.font;$('#fOut').textContent=P.font+' %';$('#lR').value=P.lw;$('#lOut').textContent='×'+fmt(P.lw,1)}
function effDock(){return P.dock==='auto'?(innerWidth<760?'bottom':'right'):P.dock}
function applyDock(){const d=effDock();main.dataset.dock=d;
  if(d==='float'){const mr=main.getBoundingClientRect(),sw=side.offsetWidth||P.width;P.float.x=Math.max(8,Math.min(P.float.x,mr.width-Math.min(sw,mr.width)-8));P.float.y=Math.max(8,Math.min(P.float.y,mr.height-80));side.style.left=P.float.x+'px';side.style.top=P.float.y+'px'}
  else{side.style.left='';side.style.top=''}}
function applyPrefs(){
  const r=document.documentElement;if(P.ui==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',P.ui);
  r.style.fontSize=(16*P.font/100)+'px';r.style.setProperty('--side-w',P.width+'px');r.style.setProperty('--side-h',P.bottomH+'%');
  Object.entries(P.colors).forEach(([k,v])=>r.style.setProperty('--s-'+k,v));
  applyDock();applyOrder();syncSettings();save();req()}
(()=>{const g=$('#grip');let st=null;
  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,fx:P.float.x,fy:P.float.y}});
  g.addEventListener('pointermove',e=>{if(!st)return;P.float.x=st.fx+e.clientX-st.x;P.float.y=st.fy+e.clientY-st.y;applyDock()});
  const end=()=>{if(st){st=null;save()}};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end)})();
window.addEventListener('resize',()=>applyDock());

buildPanels();buildSettings();applyPrefs();renderForm();applyLang();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>req());
})();
